      const getIconComponent = (iconName, className) => {
         switch(iconName) { case 'Code': return <CodeIcon className={className}/>; case 'Headphones': return <HeadphonesIcon className={className}/>; case 'FileText': return <FileTextIcon className={className}/>; case 'PenTool': return <PenToolIcon className={className}/>; case 'Megaphone': return <MegaphoneIcon className={className}/>; case 'ShieldCheck': return <ShieldCheckIcon className={className}/>; case 'Activity': return <ActivityIcon className={className}/>; default: return <ShoppingBagIcon className={className}/>; }
      };

      const getColorClasses = (colorName) => {
         const colors = { blue: 'text-blue-400 bg-blue-500/10 border-blue-500/30 group-hover:border-blue-400', green: 'text-green-400 bg-green-500/10 border-green-500/30 group-hover:border-green-400', orange: 'text-orange-400 bg-orange-500/10 border-orange-500/30 group-hover:border-orange-400', purple: 'text-purple-400 bg-purple-500/10 border-purple-500/30 group-hover:border-purple-400', cyan: 'text-cyan-400 bg-cyan-500/10 border-cyan-500/30 group-hover:border-cyan-400', indigo: 'text-indigo-400 bg-indigo-500/10 border-indigo-500/30 group-hover:border-indigo-400', yellow: 'text-yellow-400 bg-yellow-500/10 border-yellow-500/30 group-hover:border-yellow-400' };
         return colors[colorName] || colors.blue;
      };

      const renderWelcomePromo = () => {
         if (!showWelcomePromo) return null;
         return (
            <div className="fixed inset-0 z-[999999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-[fadeIn_0.5s_ease-out]">
               <div className="glass-card w-full max-w-md p-8 text-center border-[#06b6d4]/50 shadow-[0_0_50px_rgba(6,182,212,0.3)] relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-[#06b6d4] to-purple-500"></div>
                  <img src={LOGO_BASE64} alt="Logo" className="w-20 h-20 mx-auto mb-6 drop-shadow-[0_0_15px_rgba(6,182,212,0.8)] animate-pulse" />
                  <h2 className="text-3xl font-black text-white mb-4">{t('promoTitle')} <span className="text-[#06b6d4]">NEXORA</span></h2>
                  <p className="text-gray-300 font-semibold leading-relaxed mb-8 text-lg">
                     {t('promoMsg1')}<br/>{t('promoMsg2')}
                  </p>
                  <button onClick={() => setShowWelcomePromo(false)} className="btn-cyan w-full py-4 rounded-xl text-lg font-bold shadow-lg">{t('promoBtn')}</button>
               </div>
            </div>
         );
      }

      const renderDialog = () => {
        if (!dialog.isOpen) return null;
        return (
          <div className="fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
             <div className="glass-card w-full max-w-sm p-6 text-center border-[#06b6d4]/50 shadow-[0_0_30px_rgba(6,182,212,0.2)]">
                {dialog.type === 'alert' || dialog.type === 'prompt' ? <ActivityIcon className="w-12 h-12 text-[#06b6d4] mx-auto mb-4" /> : <ShieldCheckIcon className="w-12 h-12 text-blue-400 mx-auto mb-4" />}
                <h3 className="text-lg font-bold mb-6 text-white leading-relaxed">{dialog.message}</h3>
                {dialog.type === 'prompt' && <input type={dialog.inputType || 'password'} id="prompt-input-val" className="glass-input w-full rounded-xl py-3 px-4 mb-6 text-center text-lg font-bold" placeholder={dialog.inputPlaceholder || 'أدخل الرمز السري'} />}
                <div className="flex gap-3 justify-center">
                   {(dialog.type === 'confirm' || dialog.type === 'prompt') && (
                     <button onClick={() => { const inputEl = document.getElementById('prompt-input-val'); const val = dialog.type === 'prompt' ? (inputEl ? inputEl.value : null) : null; dialog.onConfirm(val); closeDialog(); }} className="px-6 py-2 rounded-xl bg-blue-500/20 text-blue-400 font-bold hover:bg-blue-500/30 transition-colors border border-blue-500/30">تأكيد</button>
                   )}
                   <button onClick={closeDialog} className="px-6 py-2 rounded-xl border border-white/10 text-gray-300 hover:bg-white/5 transition-colors font-bold">{dialog.type === 'alert' ? 'حسناً' : 'إلغاء'}</button>
                </div>
             </div>
          </div>
        );
      };

      const renderLogin = () => (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 relative z-10 animate-[fadeIn_0.5s_ease-out]">
          <button onClick={() => changeView('mainHub')} className={`absolute top-6 ${lang==='ar'?'right-6':'left-6'} text-gray-400 hover:text-white font-bold flex items-center gap-2`}><ArrowRightIcon className={`w-5 h-5 ${lang!=='ar'&&'rotate-180'}`}/> {t('backToPlat')}</button>
          <div className="text-center mb-8 flex flex-col items-center justify-center select-none">
             <img src={LOGO_BASE64} alt="NEXORA Logo" className="w-24 h-24 object-contain drop-shadow-[0_0_15px_rgba(6,182,212,0.6)] mb-4" />
             <h1 className="text-5xl font-black tracking-widest mb-2"><span className="text-white">NEXORA</span> <span className="text-[#06b6d4]">SYRIA</span></h1>
          </div>
          <div className="glass-card w-full max-w-md p-8 border-[#06b6d4]/20">
            <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-2"><LockIcon className="w-6 h-6 text-[#06b6d4]"/> {t('loginTitle')}</h2>
            <form onSubmit={handleLoginAction} className="space-y-4">
              <div className="relative"><UserIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} /><input required type="text" placeholder={t('phoneNum')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-sm font-bold`} value={loginInput} onChange={e => setLoginInput(e.target.value)} /></div>
              <div className="relative"><LockIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} /><input required type="password" placeholder={t('pass')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-sm font-bold`} value={loginPassword} onChange={e => setLoginPassword(e.target.value)} /></div>
              
              {/* زر استعادة كلمة المرور */}
              <div className="flex justify-end mt-1">
                 <button type="button" onClick={() => showAlert('لاستعادة حسابك، يرجى التواصل مع إدارة المنصة وطلب "تصفير الأمان". بعد ذلك ستتمكن من عمل "إنشاء حساب جديد" بنفس رقمك وسيتم استعادة رصيدك وطلباتك تلقائياً.')} className="text-[#06b6d4] text-xs font-bold hover:underline transition-colors">نسيت كلمة المرور؟</button>
              </div>

              <button type="submit" disabled={loading} className="btn-cyan w-full rounded-xl py-3 text-lg font-bold flex justify-center items-center mt-6">{loading ? t('verifying') : t('loginBtn')}</button>
            </form>
            <div className="mt-8 text-center border-t border-white/10 pt-4"><p className="text-gray-400 text-sm">{t('noAccount')} <button onClick={() => changeView('register')} className="text-[#06b6d4] font-bold hover:underline">{t('createAcc')}</button></p></div>
          </div>
        </div>
      );

      const renderRegister = () => (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 relative z-10 animate-[fadeIn_0.5s_ease-out]">
          <button onClick={() => changeView('mainHub')} className={`absolute top-6 ${lang==='ar'?'right-6':'left-6'} text-gray-400 hover:text-white font-bold flex items-center gap-2`}><ArrowRightIcon className={`w-5 h-5 ${lang!=='ar'&&'rotate-180'}`}/> {t('backToPlat')}</button>
          <div className="text-center mb-8 flex flex-col items-center select-none">
             <img src={LOGO_BASE64} alt="NEXORA Logo" className="w-16 h-16 object-contain drop-shadow-[0_0_10px_rgba(6,182,212,0.6)] mb-2" />
             <h1 className="text-4xl font-black tracking-widest mb-2"><span className="text-white">NEXORA</span> <span className="text-[#06b6d4]">SYRIA</span></h1>
          </div>
          <div className="glass-card w-full max-w-md p-8 border-[#06b6d4]/20">
            <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-2"><UserIcon className="w-6 h-6 text-[#06b6d4]"/> {t('createAcc')}</h2>
            <form onSubmit={handleRegister} className="space-y-4">
              <div className="relative"><UserIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} /><input required type="text" placeholder={t('fullName')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-sm font-bold`} value={registerData.name} onChange={e => setRegisterData({...registerData, name: e.target.value})} /></div>
              <div className="relative"><PhoneIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} /><input required type="tel" placeholder={t('whatsapp')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-sm font-bold`} value={registerData.whatsapp} onChange={e => setRegisterData({...registerData, whatsapp: e.target.value})} /></div>
              <div className="relative"><MapPinIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} /><input required type="text" placeholder={t('area')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-sm font-bold`} value={registerData.area} onChange={e => setRegisterData({...registerData, area: e.target.value})} /></div>
              <div className="relative"><LockIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} /><input required type="password" placeholder={t('choosePass')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-sm font-bold`} value={registerData.password} onChange={e => setRegisterData({...registerData, password: e.target.value})} /></div>
              <button type="submit" disabled={loading} className="btn-cyan w-full rounded-xl py-3 text-lg font-bold mt-6">{t('regBtn')}</button>
            </form>
            <div className="mt-6 text-center border-t border-white/10 pt-4"><p className="text-gray-400 text-sm">{t('haveAcc')} <button onClick={() => changeView('login')} className="text-[#06b6d4] font-bold hover:underline">{t('loginHere')}</button></p></div>
          </div>
        </div>
      );

      const renderAbout = () => (
         <div className="min-h-screen max-w-4xl mx-auto p-4 md:p-8 pt-12 relative z-10 animate-[fadeIn_0.3s_ease-out]">
            <button onClick={() => changeView('mainHub')} className={`mb-8 flex items-center gap-2 text-gray-400 hover:text-white font-bold transition-colors`}><ArrowRightIcon className={`w-5 h-5 ${lang!=='ar'&&'rotate-180'}`} /> {t('backToPlat')}</button>
            <div className="glass-card p-10 border-t-4 border-t-[#06b6d4]">
               <div className="flex justify-center mb-8"><div className="p-5 rounded-3xl bg-[#06b6d4]/10 border border-[#06b6d4]/30 shadow-[0_0_30px_rgba(6,182,212,0.2)]"><InfoIcon className="w-16 h-16 text-[#06b6d4]" /></div></div>
               <h1 className="text-4xl font-black text-center text-white mb-6">{t('aboutTitle')}</h1>
               <div className="space-y-6 text-gray-300 font-semibold leading-loose text-lg text-center"><p>{t('aboutDesc1')}</p><p>{t('aboutDesc2')}</p></div>
            </div>
         </div>
      );

      const renderTerms = () => (
         <div className="min-h-screen max-w-4xl mx-auto p-4 md:p-8 pt-12 relative z-10 animate-[fadeIn_0.3s_ease-out]">
            <button onClick={() => changeView('mainHub')} className={`mb-8 flex items-center gap-2 text-gray-400 hover:text-white font-bold transition-colors`}><ArrowRightIcon className={`w-5 h-5 ${lang!=='ar'&&'rotate-180'}`} /> {t('backToPlat')}</button>
            <div className="glass-card p-10 border-t-4 border-t-purple-500">
               <div className="flex items-center gap-4 mb-8 pb-4 border-b border-white/10"><FileTextIcon className="w-10 h-10 text-purple-400" /><h1 className="text-3xl font-black text-white">{t('termsTitle')}</h1></div>
               <div className="space-y-6 text-gray-300 font-semibold leading-relaxed">
                  <div><h3 className="text-xl font-bold text-purple-400 mb-2">1. {t('t1')}</h3><p>{t('t1d')}</p></div>
                  <div><h3 className="text-xl font-bold text-purple-400 mb-2">2. {t('t2')}</h3><p>{t('t2d')}</p></div>
                  <div><h3 className="text-xl font-bold text-purple-400 mb-2">3. {t('t3')}</h3><p>{t('t3d')}</p></div>
               </div>
            </div>
         </div>
      );

      const renderWallet = () => {
         const currentBonus = calculateBonus(topupAmount);
         const expectedTotal = parseFloat(topupAmount || 0) + currentBonus;

         return (
            <div className="min-h-screen max-w-6xl mx-auto p-4 md:p-8 pt-12 relative z-10 animate-[fadeIn_0.3s_ease-out]">
               <button onClick={() => changeView('mainHub')} className={`mb-8 flex items-center gap-2 text-gray-400 hover:text-white font-bold transition-colors`}><ArrowRightIcon className={`w-5 h-5 ${lang!=='ar'&&'rotate-180'}`} /> {t('backToPlat')}</button>
               <h2 className="text-4xl font-black text-white mb-8 border-b border-white/10 pb-4 flex items-center gap-3"><WalletIcon className="text-emerald-400 w-10 h-10"/> {t('wallet')}</h2>
               
               <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="space-y-8">
                     <div className="glass-card p-8 bg-gradient-to-br from-emerald-900/40 to-transparent border-emerald-500/50 shadow-[0_0_40px_rgba(16,185,129,0.15)] relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
                        <p className="text-emerald-200 font-bold mb-2">{t('balance')}</p>
                        <h3 className="text-5xl font-black text-white tracking-wider" dir="ltr">{formatPrice(userData.balance || 0)}</h3>
                     </div>

                     <div className="glass-card p-6 border-t-4 border-t-[#06b6d4]">
                        <h3 className="text-xl font-bold text-white mb-6">{t('topup')}</h3>
                        
                        <div className="mb-6 p-4 rounded-xl bg-purple-500/10 border border-purple-500/30">
                           <h4 className="text-purple-400 font-bold text-sm mb-2 flex items-center gap-2"><GiftIcon className="w-5 h-5" /> {t('exclusiveOffers')}</h4>
                           <ul className="text-gray-300 text-xs space-y-1 font-semibold">
                              {bonusTiers.sort((a,b)=>a.threshold-b.threshold).map((tier, i) => (
                                 <li key={i}>• {t('topupGet')} <span className="text-white font-bold">${tier.threshold}</span> {t('getBonus')} <span className="text-green-400 font-bold">${tier.bonus} {t('freeBonus')}</span></li>
                              ))}
                           </ul>
                        </div>

                        <form onSubmit={handleTopUpRequest} className="space-y-4">
                           <div>
                              <label className="text-xs text-gray-400 font-bold mb-2 block">{t('payMethod')}</label>
                              <div className="flex gap-2">
                                 <button type="button" onClick={()=>setPaymentMethod('bank')} className={`flex-1 py-3 rounded-xl border text-sm font-bold transition-colors ${paymentMethod === 'bank' ? 'bg-[#06b6d4]/20 border-[#06b6d4] text-[#06b6d4]' : 'border-white/10 text-gray-400 hover:bg-white/5'}`}>{t('bankTransfer')}</button>
                                 <button type="button" onClick={()=>setPaymentMethod('cash')} className={`flex-1 py-3 rounded-xl border text-sm font-bold transition-colors ${paymentMethod === 'cash' ? 'bg-[#06b6d4]/20 border-[#06b6d4] text-[#06b6d4]' : 'border-white/10 text-gray-400 hover:bg-white/5'}`}>{t('cashPay')}</button>
                              </div>
                           </div>
                           <div className="relative">
                              <DollarSignIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} />
                              <input required type="number" min="1" step="0.01" placeholder={t('enterAmount')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-lg font-black text-[#06b6d4]`} value={topupAmount} onChange={e => setTopupAmount(e.target.value)} />
                           </div>
                           
                           {topupAmount > 0 && currentBonus > 0 && (
                              <div className="bg-green-500/10 border border-green-500/30 rounded-xl p-3 text-center animate-[fadeIn_0.3s_ease-out]">
                                 <p className="text-green-400 text-sm font-bold">{t('congrats')} <span className="text-white text-lg">${currentBonus}</span> {t('extraFree')}</p>
                                 <p className="text-xs text-gray-400 mt-1">{t('expectedTotal')} <span className="text-white font-bold">${expectedTotal}</span></p>
                              </div>
                           )}

                           {paymentMethod === 'bank' && (
                              <label className="block w-full border-2 border-dashed border-[#06b6d4]/40 rounded-xl p-4 text-center cursor-pointer hover:bg-[#06b6d4]/10 transition-colors">
                                 <UploadCloudIcon className="w-6 h-6 text-[#06b6d4] mx-auto mb-2" />
                                 <span className="text-xs font-bold text-[#06b6d4]">{receiptFile ? receiptFile.name : t('attachBtn')}</span>
                                 <input type="file" className="hidden" accept="image/*,.pdf" onChange={(e) => handleFileUpload(e, setReceiptFile)} />
                              </label>
                           )}
                           <button type="submit" disabled={loading} className="btn-cyan w-full rounded-xl py-3 text-sm font-bold">{loading ? t('processing') : t('reqTopup')}</button>
                        </form>
                     </div>
                  </div>

                  <div className="glass-card p-6 border-[#06b6d4]/20 flex flex-col max-h-[750px]">
                     <h3 className="text-xl font-bold text-white mb-6 pb-4 border-b border-white/10 flex items-center gap-2"><ActivityIcon className="text-purple-400 w-5 h-5"/> {t('transHistory')}</h3>
                     <div className="flex-1 overflow-y-auto scrollbar-hide space-y-3">
                        {userTransactions.length === 0 ? <p className="text-center text-gray-500 py-10 font-bold border border-dashed border-gray-700 rounded-xl">{t('noTrans')}</p> : userTransactions.map((tr, idx) => (
                           <div key={idx} className="bg-black/30 p-4 rounded-xl border border-white/5 flex justify-between items-center">
                              <div><p className="text-xs text-gray-400 mb-1">{tr.dateString}</p><p className="text-sm font-bold text-white">{tr.desc}</p></div>
                              <div className="text-left">
                                 <p className="text-xs mb-1 font-bold">{tr.type.includes('إيداع') || tr.type.includes('استرداد') ? t('deposit') : t('withdraw')}</p>
                                 <p className={`text-lg font-black ${tr.type.includes('سداد') ? 'text-red-400' : 'text-emerald-400'}`} dir="ltr">{tr.type.includes('سداد') ? '-' : '+'}${parseFloat(tr.amount).toFixed(2)}</p>
                              </div>
                           </div>
                        ))}
                     </div>
                  </div>
               </div>
            </div>
         );
      };

      const renderMainHub = () => (
        <div className="min-h-screen max-w-6xl mx-auto p-4 md:p-8 pt-12 relative z-10 animate-[fadeIn_0.5s_ease-out] flex flex-col justify-between">
          <div>
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
               <div className="flex items-center gap-4">
                  <img src={LOGO_BASE64} alt="Logo" className="w-14 h-14 object-contain drop-shadow-[0_0_10px_rgba(6,182,212,0.8)]" />
                  <div>
                     {userData ? (
                        <React.Fragment>
                           <h2 className="text-3xl font-black text-white mb-1">{t('welcome')} <span className="text-[#06b6d4]">{userData.name}</span></h2>
                           <div className="flex items-center gap-3 text-gray-400 text-xs font-bold"><ShieldCheckIcon className="w-3 h-3 text-green-400" /> {t('id')} {userData.serialId}</div>
                        </React.Fragment>
                     ) : ( <h2 className="text-3xl font-black text-white">NEXORA <span className="text-[#06b6d4]">PLATFORM</span></h2> )}
                  </div>
               </div>
               
               <div className="flex items-center gap-3 flex-wrap">
                  <div className="glass-card p-1 flex bg-black/50 border-white/10 rounded-full">
                     <button onClick={()=>setLang('ar')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${lang==='ar'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>AR</button>
                     <button onClick={()=>setLang('en')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${lang==='en'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>EN</button>
                     <button onClick={()=>setLang('tr')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${lang==='tr'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>TR</button>
                  </div>
                  <div className="glass-card p-1 flex bg-black/50 border-white/10 rounded-full">
                     <button onClick={()=>setCurrency('USD')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${currency==='USD'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>$</button>
                     <button onClick={()=>setCurrency('SYP')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${currency==='SYP'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>ل.س</button>
                  </div>
                  {userData ? (
                     <React.Fragment>
                        <button onClick={()=>changeView('wallet')} className="glass-card px-4 py-2 flex items-center gap-2 text-emerald-400 font-bold hover:bg-emerald-500/10 transition-colors">
                           <WalletIcon className="w-5 h-5"/>
                           <span dir="ltr">{formatPrice(userData.balance || 0)}</span>
                        </button>
                        <button onClick={()=>setIsCartOpen(true)} className="glass-card px-4 py-2 flex items-center gap-2 text-[#06b6d4] font-bold hover:bg-[#06b6d4]/10 relative"><ShoppingBagIcon className="w-5 h-5"/> {cart.length > 0 && <span className="absolute -top-2 -right-2 bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px]">{cart.length}</span>}</button>
                        <button onClick={logout} className="glass-card px-4 py-2 text-sm font-bold text-red-400 hover:bg-red-500/10">{t('logout')}</button>
                     </React.Fragment>
                  ) : ( <button onClick={() => changeView('login')} className="btn-cyan px-6 py-2 rounded-xl text-sm font-bold shadow-lg flex items-center gap-2"><UserIcon className="w-4 h-4"/> {t('loginPlatform')}</button> )}
               </div>
            </div>

            <div className="text-center mb-16 mt-8">
               <h1 className="text-5xl md:text-7xl font-black tracking-widest mb-4 select-none">
                 <span className="text-white">NEXORA</span> <span className="text-[#06b6d4]">SYRIA</span>
               </h1>
               <p className="text-gray-400 font-bold tracking-wide border-t border-[#06b6d4]/30 pt-4 mx-auto w-fit text-lg">{t('explore')}</p>
            </div>

            <div id="services-section" className="mb-12">
               <h3 className={`text-2xl font-black text-white mb-6 border-${lang==='ar'?'r':'l'}-4 border-[#06b6d4] p${lang==='ar'?'r':'l'}-4`}>{t('servicesCats')}</h3>
               <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-16">
                  {defaultCategories.map((cat, idx) => {
                     const colorClass = getColorClasses(cat.color);
                     const catName = cat[`name_${lang}`] || cat.name_ar || cat.name;
                     return (
                       <div key={cat.id} onClick={() => changeView('mainHub', cat)} className="glass-card p-6 cursor-pointer group flex flex-col items-center text-center justify-center min-h-[160px]">
                         <div className={`w-14 h-14 rounded-xl flex items-center justify-center mb-4 transition-transform group-hover:scale-110 border ${colorClass.split(' ')[1]} ${colorClass.split(' ')[2]}`}>
                           {getIconComponent(cat.icon, `w-7 h-7 ${colorClass.split(' ')[0]}`)}
                         </div>
                         <h3 className="font-bold text-sm text-gray-200 group-hover:text-white transition-colors">{catName}</h3>
                       </div>
                     )
                  })}
               </div>
            </div>

            {userData && (
               <div className="border-t border-white/10 pt-12 mb-12 animate-[fadeIn_0.8s_ease-out]">
                  <h3 className={`text-2xl font-black text-white mb-8 flex items-center gap-2 border-${lang==='ar'?'r':'l'}-4 border-[#06b6d4] p${lang==='ar'?'r':'l'}-4`}><ActivityIcon className={`w-6 h-6 text-[#06b6d4] m${lang==='ar'?'l':'r'}-2`}/> {t('myLiveOrders')}</h3>
                  <div className="space-y-4">
                     {userRequests.length === 0 ? <p className="text-gray-500 font-bold text-center py-6 glass-card border-dashed">{t('noOrders')}</p> : userRequests.map((req, idx) => (
                        <div key={idx} className={`glass-card p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-${lang==='ar'?'r':'l'}-4 border-[#06b6d4]`}>
                           <div className="flex-1 w-full">
                              <p className="text-xs text-gray-400 font-bold mb-1">{req.dateString}</p>
                              <h3 className="text-lg font-bold text-white mb-2">{req.type}</h3>
                              <p className="text-sm text-gray-400 font-semibold whitespace-pre-wrap">{req.details}</p>
                              
                              {req.adminNote && (
                                 <div className="mt-4 p-4 rounded-xl bg-purple-900/20 border border-purple-500/30 w-full shadow-[0_0_15px_rgba(168,85,247,0.1)]">
                                    <span className="text-purple-400 font-bold text-xs flex items-center gap-1 mb-1"><ActivityIcon className="w-3 h-3"/> {t('adminReply')}</span>
                                    <span className="text-gray-200 text-sm font-semibold">{req.adminNote}</span>
                                 </div>
                              )}
                           </div>
                           <div className="flex flex-col gap-2 items-end w-full md:w-auto mt-4 md:mt-0">
                             <div className={`px-5 py-2.5 rounded-xl font-bold text-sm border whitespace-nowrap shadow-lg ${(req.status || '').includes('مكتمل') || (req.status || '').includes('تم الحل') ? 'bg-green-500/10 border-green-500/30 text-green-400' : (req.status || '').includes('مرفوض') ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-[#06b6d4]/10 border-[#06b6d4]/30 text-[#06b6d4]'}`}>
                                {t('status')} {req.status || 'قيد المراجعة ⏳'}
                             </div>
                           </div>
                        </div>
                     ))}
                  </div>
               </div>
            )}
          </div>
          <div className="mt-20 border-t border-white/5 pt-8 pb-4 flex flex-col md:flex-row justify-between items-center gap-6 text-sm text-gray-400 font-bold">
            <p>{t('rights')}</p>
            <div className="flex gap-6">
               <button onClick={() => changeView('about')} className="hover:text-[#06b6d4] transition-colors flex items-center gap-1"><InfoIcon className="w-4 h-4"/> {t('about')}</button>
               <button onClick={() => { const target = document.getElementById('services-section'); if(target) target.scrollIntoView({ behavior: 'smooth' }); }} className="hover:text-[#06b6d4] transition-colors flex items-center gap-1"><CodeIcon className="w-4 h-4"/> {t('ourServices')}</button>
               <button onClick={() => changeView('terms')} className="hover:text-[#06b6d4] transition-colors flex items-center gap-1"><FileTextIcon className="w-4 h-4"/> {t('terms')}</button>
            </div>
          </div>
        </div>
      );

      const renderCategoryView = () => {
         const catServices = services.filter(s => s.categoryId === activeCategory.id);
         const colorClass = getColorClasses(activeCategory.color);
         const activeCatName = activeCategory[`name_${lang}`] || activeCategory.name_ar || activeCategory.name;
         return (
            <div className="min-h-screen max-w-5xl mx-auto p-4 md:p-8 pt-12 relative z-10 animate-[fadeIn_0.3s_ease-out]">
               <button onClick={() => changeView('mainHub')} className={`mb-8 flex items-center gap-2 text-gray-400 hover:text-white font-bold transition-colors`}><ArrowRightIcon className={`w-5 h-5 ${lang!=='ar'&&'rotate-180'}`} /> {t('backToCats')}</button>
               <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                  <div className="flex items-center gap-4">
                     <div className={`p-3 rounded-xl bg-white/5 border ${colorClass.split(' ')[2]}`}>{getIconComponent(activeCategory.icon, `w-8 h-8 ${colorClass.split(' ')[0]}`)}</div>
                     <h2 className="text-3xl font-black text-white">{activeCatName}</h2>
                  </div>
               </div>
               
               <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {isFetchingServices ? Array.from({length: 6}).map((_, i) => <SkeletonCard key={i} />) : catServices.length === 0 ? (
                      <p className="text-gray-500 col-span-full text-center py-10 font-bold glass-card border-dashed">{t('emptyCat')}</p>
                  ) : catServices.map(srv => {
                     const srvName = srv[`name_${lang}`] || srv.name_ar || srv.name;
                     const srvDesc = srv[`desc_${lang}`] || srv.desc_ar || srv.desc;
                     
                     return(
                     <div key={srv.id} className="glass-card p-6 flex flex-col justify-between group">
                        <div className="mb-4">
                           <h3 className="text-xl font-bold mb-2 text-white group-hover:text-[#06b6d4] transition-colors">{srvName}</h3>
                           <p className="text-gray-400 text-xs leading-relaxed whitespace-pre-wrap">{srvDesc}</p>
                        </div>
                        <div className="flex items-center justify-between mt-auto pt-4 border-t border-white/5">
                           <span className={`text-xl font-black ${colorClass.split(' ')[0]}`} dir="ltr">{formatPrice(srv.price)}</span>
                           <button onClick={()=>handleRequestService(srv)} className={`px-4 py-2 rounded-lg font-bold text-xs transition-colors ${colorClass.split(' ')[1]} hover:bg-white/10 text-white`}>{t('addToOrder')}</button>
                        </div>
                     </div>
                  )})}
               </div>
            </div>
         );
      };

      const renderCartModal = () => {
         const rawTotal = cart.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0);
         const percentVal = parseFloat(discountInfo.percent) || 0;
         const finalTotal = discountInfo.active ? rawTotal - (rawTotal * (percentVal / 100)) : rawTotal;
         
         const userBalance = userData ? (parseFloat(userData.balance) || 0) : 0;
         const isBalanceSufficient = userBalance >= finalTotal;

         return (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-[fadeIn_0.2s_ease-out]">
               <div className="glass-card w-full max-w-lg max-h-[90vh] flex flex-col shadow-[0_0_50px_rgba(6,182,212,0.15)] border-[#06b6d4]/30">
                  <div className="p-6 border-b border-white/10 shrink-0 flex justify-between items-center">
                     <h3 className="text-xl font-black text-white flex items-center gap-2"><ShoppingBagIcon className="text-[#06b6d4] w-6 h-6"/> {t('checkoutTitle')}</h3>
                     <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-white font-bold transition-colors text-2xl">&times;</button>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto p-6 space-y-6 scrollbar-hide">
                     <div className="space-y-3">
                        {cart.length === 0 ? <p className="text-center text-gray-500 my-4 font-bold">{t('emptyCart')}</p> : cart.map((item, idx) => {
                              const itemName = item[`name_${lang}`] || item.name_ar || item.name || 'خدمة غير محددة';
                              return (
                              <div key={idx} className="glass-card p-3 flex justify-between items-center bg-white/5 border-transparent">
                                 <div><p className="font-bold text-sm text-gray-200">{itemName}</p><p className="text-[#06b6d4] font-black text-xs" dir="ltr">{formatPrice(item.price)}</p></div>
                                 <button onClick={() => setCart(cart.filter((_, i) => i !== idx))} className="text-red-400 p-2 hover:bg-red-500/20 rounded-lg"><Trash2Icon className="w-4 h-4"/></button>
                              </div>
                              );
                        })}
                     </div>

                     {cart.length > 0 && (
                        <div className="glass-card p-5 bg-black/30 border-white/5 mb-6">
                           <div className="flex justify-between items-center mb-2">
                              <span className="text-gray-400 font-bold text-sm">{t('balance')}</span>
                              <span className={`text-lg font-black ${isBalanceSufficient ? 'text-emerald-400' : 'text-red-400'}`} dir="ltr">{formatPrice(userBalance)}</span>
                           </div>
                           {!isBalanceSufficient && (
                              <div className="mt-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold text-center">
                                 {t('insufficient')}
                                 <button onClick={() => { setIsCartOpen(false); changeView('wallet'); }} className="block mt-2 mx-auto underline">{t('goToTopup')}</button>
                              </div>
                           )}
                        </div>
                     )}
                  </div>

                  {cart.length > 0 && (
                     <div className="p-6 border-t border-white/10 shrink-0 bg-black/40 rounded-b-2xl">
                        <div className="flex justify-between items-center mb-4"><span className="text-gray-400 font-bold text-sm">{t('totalRequired')}</span><span className="text-2xl font-black text-[#06b6d4]" dir="ltr">{formatPrice(finalTotal)}</span></div>
                        <button onClick={handleCheckoutFromWallet} disabled={loading || !isBalanceSufficient} className={`w-full rounded-xl py-4 text-sm font-bold flex justify-center items-center gap-2 transition-all ${isBalanceSufficient ? 'btn-cyan' : 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700'}`}>
                           {loading ? t('processing') : <React.Fragment><WalletIcon className="w-5 h-5"/> {t('payFromWallet')}</React.Fragment>}
                        </button>
                     </div>
                  )}
               </div>
            </div>
         );
      };

      const renderAdminDashboard = () => {
        const totalRevenue = adminTasks.filter(t => (t.status || '').includes('مكتمل') && !(t.type || '').includes('شحن')).reduce((sum, t) => sum + parseFloat(t.total || 0), 0);
        const pendingCount = adminTasks.filter(t => (t.status || '').includes('قيد المراجعة')).length;
        const totalTrust = adminClients.reduce((sum, client) => sum + (parseFloat(client.balance) || 0), 0);
        
        const totalBonusesGiven = adminTasks.filter(t => (t.status || '').includes('مكتمل') && (t.type || '').includes('شحن')).reduce((sum, t) => sum + (parseFloat(t.bonusAmount) || 0), 0);

        const filteredOrders = adminTasks.filter(task => {
            const s = task.status || 'قيد المراجعة ⏳';
            if (adminOrderFilter === 'all') return true;
            if (adminOrderFilter === 'pending') return s.includes('مراجعة');
            if (adminOrderFilter === 'progress') return s.includes('تنفيذ');
            if (adminOrderFilter === 'completed') return s.includes('مكتمل') || s.includes('تم الحل');
            if (adminOrderFilter === 'rejected') return s.includes('مرفوض');
            return true;
        });
        const paginatedOrders = filteredOrders.slice((adminOrdersPage - 1) * itemsPerPage, adminOrdersPage * itemsPerPage);
        const totalOrderPages = Math.ceil(filteredOrders.length / itemsPerPage);

        const paginatedClients = adminClients.slice((adminClientsPage - 1) * itemsPerPage, adminClientsPage * itemsPerPage);
        const totalClientPages = Math.ceil(adminClients.length / itemsPerPage);

        return (
        <div className="min-h-screen max-w-7xl mx-auto p-4 md:p-8 pt-12 relative z-10 animate-[fadeIn_0.5s_ease-out]">
          
          {editingClient && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-[fadeIn_0.2s_ease-out]">
               <div className="glass-card w-full max-w-md p-8 border-[#06b6d4]/50 shadow-[0_0_40px_rgba(6,182,212,0.2)]">
                  <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><EditIcon className="w-6 h-6 text-[#06b6d4]"/> تحديث بيانات العميل</h3>
                  <form onSubmit={handleUpdateClientData} className="space-y-4">
                     <div><label className="text-xs text-gray-400 font-bold mb-1 block">الاسم الكامل</label><input required type="text" className="glass-input w-full rounded-xl py-3 px-4 text-sm font-bold" value={editingClient.name} onChange={e => setEditingClient({...editingClient, name: e.target.value})} /></div>
                     <div><label className="text-xs text-gray-400 font-bold mb-1 block">رقم الواتساب</label><input required type="text" className="glass-input w-full rounded-xl py-3 px-4 text-sm font-bold" value={editingClient.whatsapp} onChange={e => setEditingClient({...editingClient, whatsapp: e.target.value})} /></div>
                     <div><label className="text-xs text-gray-400 font-bold mb-1 block">المنطقة</label><input required type="text" className="glass-input w-full rounded-xl py-3 px-4 text-sm font-bold" value={editingClient.area} onChange={e => setEditingClient({...editingClient, area: e.target.value})} /></div>
                     <div><label className="text-xs text-emerald-400 font-bold mb-1 block">رصيد المحفظة ($ USD)</label><input required type="number" step="0.01" className="glass-input w-full rounded-xl py-3 px-4 text-sm font-black text-emerald-400" value={editingClient.balance} onChange={e => setEditingClient({...editingClient, balance: e.target.value})} /></div>
                     <div className="flex gap-2 mt-6">
                        <button type="button" onClick={() => setEditingClient(null)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-400 hover:bg-white/5 transition-colors font-bold">إلغاء</button>
                        <button type="submit" disabled={loading} className="flex-1 btn-cyan py-3 rounded-xl font-bold">{loading ? 'جاري الحفظ...' : 'حفظ التعديلات'}</button>
                     </div>
                  </form>
               </div>
            </div>
          )}

          <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div><h2 className="text-3xl font-black text-[#06b6d4] flex items-center gap-3"><SettingsIcon className="w-8 h-8"/> {t('adminDash')}</h2></div>
            <button onClick={() => { window.location.hash = ''; setCurrentView('mainHub'); }} className="glass-card px-4 py-2 text-sm font-bold text-red-400 hover:bg-red-500/10 border border-red-500/20 transition-colors">{t('endSession')}</button>
          </div>

          <div className="flex overflow-x-auto bg-black/40 rounded-xl p-1 mb-8 border border-white/5 w-full gap-1 scrollbar-hide">
             <button onClick={() => setAdminViewSection('overview')} className={`px-6 py-3 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${adminViewSection === 'overview' ? 'bg-[#06b6d4]/20 text-[#06b6d4]' : 'text-gray-400 hover:text-white'}`}><ActivityIcon className="w-4 h-4 inline mx-2"/> {t('overview')}</button>
             <button onClick={() => setAdminViewSection('clients')} className={`px-6 py-3 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${adminViewSection === 'clients' ? 'bg-[#06b6d4]/20 text-[#06b6d4]' : 'text-gray-400 hover:text-white'}`}><UsersIcon className="w-4 h-4 inline mx-2"/> {t('clientsDb')}</button>
             <button onClick={() => setAdminViewSection('catalog')} className={`px-6 py-3 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${adminViewSection === 'catalog' ? 'bg-[#06b6d4]/20 text-[#06b6d4]' : 'text-gray-400 hover:text-white'}`}><ShoppingBagIcon className="w-4 h-4 inline mx-2"/> {t('catalog')}</button>
             <button onClick={() => setAdminViewSection('orders')} className={`relative px-6 py-3 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${adminViewSection === 'orders' ? 'bg-[#06b6d4]/20 text-[#06b6d4]' : 'text-gray-400 hover:text-white'}`}>
                <FileTextIcon className="w-4 h-4 inline mx-2"/> {t('ordersAdmin')}
                {pendingCount > 0 && <span className="absolute top-2 right-2 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span></span>}
             </button>
             <button onClick={() => setAdminViewSection('settings')} className={`px-6 py-3 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${adminViewSection === 'settings' ? 'bg-[#06b6d4]/20 text-[#06b6d4]' : 'text-gray-400 hover:text-white'}`}><SettingsIcon className="w-4 h-4 inline mx-2"/> {t('settingsAdmin')}</button>
          </div>

          {adminViewSection === 'overview' && (
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-8">
               <div className="glass-card p-5 border-b-4 border-b-blue-500"><div className="flex justify-between items-start"><div><p className="text-gray-400 text-xs font-bold mb-1">{t('totalClients')}</p><h3 className="text-2xl font-black text-white">{adminClients.length}</h3></div><UsersIcon className="w-8 h-8 text-blue-400 opacity-50" /></div></div>
               <div className="glass-card p-5 border-b-4 border-b-amber-500"><div className="flex justify-between items-start"><div><p className="text-gray-400 text-xs font-bold mb-1">{t('pendingOrders')}</p><h3 className="text-2xl font-black text-white">{pendingCount}</h3></div><ActivityIcon className="w-8 h-8 text-amber-400 opacity-50" /></div></div>
               <div className="glass-card p-5 border-b-4 border-b-purple-500"><div className="flex justify-between items-start"><div><p className="text-gray-400 text-xs font-bold mb-1">{t('trustFund')}</p><h3 className="text-2xl font-black text-purple-400" dir="ltr">{formatPrice(totalTrust)}</h3></div><WalletIcon className="w-8 h-8 text-purple-400 opacity-50" /></div></div>
               <div className="glass-card p-5 border-b-4 border-b-fuchsia-500"><div className="flex justify-between items-start"><div><p className="text-gray-400 text-xs font-bold mb-1">{t('bonusesGiven')}</p><h3 className="text-2xl font-black text-fuchsia-400" dir="ltr">{formatPrice(totalBonusesGiven)}</h3></div><GiftIcon className="w-8 h-8 text-fuchsia-400 opacity-50" /></div></div>
               <div className="glass-card p-5 border-b-4 border-b-emerald-500"><div className="flex justify-between items-start"><div><p className="text-gray-400 text-xs font-bold mb-1">{t('totalRev')}</p><h3 className="text-2xl font-black text-emerald-400" dir="ltr">{formatPrice(totalRevenue)}</h3></div><DollarSignIcon className="w-8 h-8 text-emerald-400 opacity-50" /></div></div>
            </div>
          )}

          {adminViewSection === 'clients' && (
            <div>
               <div className="overflow-x-auto glass-card border-[#06b6d4]/20 mb-4">
                  <table className="w-full text-sm text-gray-300" style={{textAlign: lang==='ar'?'right':'left'}}>
                     <thead className="bg-[#06b6d4]/10 text-[#06b6d4] font-bold border-b border-[#06b6d4]/20">
                        <tr><th className="p-4">ID</th><th className="p-4">{t('fullName')}</th><th className="p-4">WhatsApp</th><th className="p-4">{t('area')}</th><th className="p-4">{t('balanceCol')} (USD)</th><th className="p-4 text-center">الإجراء</th></tr>
                     </thead>
                     <tbody>
                        {paginatedClients.map(client => (
                           <tr key={client.id} className="border-b border-white/5 hover:bg-white/5 transition-colors">
                              <td className="p-4 font-mono text-[#06b6d4] font-bold">{client.serialId}</td>
                              <td className="p-4 font-bold text-white">{client.name}</td>
                              <td className="p-4"><a href={`https://wa.me/${client.whatsapp}`} target="_blank" className="text-green-400 hover:underline font-bold" dir="ltr">{client.whatsapp}</a></td>
                              <td className="p-4 font-bold">{client.area}</td>
                              <td className="p-4 font-black text-emerald-400" dir="ltr">${(parseFloat(client.balance) || 0).toFixed(2)}</td>
                              <td className="p-4 text-center">
                                 <button onClick={() => setEditingClient(client)} className="text-blue-400 bg-blue-500/10 hover:bg-blue-500/20 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">تعديل البيانات</button>
                              </td>
                           </tr>
                        ))}
                     </tbody>
                  </table>
               </div>
               {totalClientPages > 1 && (
                  <div className="flex justify-center gap-2">
                     <button onClick={() => setAdminClientsPage(p => Math.max(1, p - 1))} disabled={adminClientsPage===1} className="px-4 py-2 glass-card text-sm font-bold hover:bg-white/10">{t('prev')}</button>
                     <span className="px-4 py-2 text-[#06b6d4] font-bold">{t('page')} {adminClientsPage} / {totalClientPages}</span>
                     <button onClick={() => setAdminClientsPage(p => Math.min(totalClientPages, p + 1))} disabled={adminClientsPage===totalClientPages} className="px-4 py-2 glass-card text-sm font-bold hover:bg-white/10">{t('next')}</button>
                  </div>
               )}
            </div>
          )}

          {adminViewSection === 'catalog' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <div className="glass-card p-6 h-fit border-t-4 border-t-[#06b6d4]" id="service-form">
                 <h3 className="text-xl font-bold mb-4 text-[#06b6d4]">{editingServiceId ? t('updateService') : t('addService')}</h3>
                 <div className="space-y-4">
                    <select className="glass-input w-full rounded-xl py-3 px-4 text-sm font-bold outline-none" value={newItem.categoryId} onChange={e=>setNewItem({...newItem, categoryId: e.target.value})}>
                       {defaultCategories.map(c => <option key={c.id} value={c.id} className="bg-gray-900 text-white">{c[`name_${lang}`] || c.name_ar}</option>)}
                    </select>
                    
                    <div className="flex gap-2 bg-black/30 p-1 rounded-xl border border-white/10">
                       <button onClick={() => setActiveLangTab('ar')} className={`flex-1 py-2 rounded-lg font-bold text-xs transition-colors ${activeLangTab === 'ar' ? 'bg-[#06b6d4] text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>عربي</button>
                       <button onClick={() => setActiveLangTab('en')} className={`flex-1 py-2 rounded-lg font-bold text-xs transition-colors ${activeLangTab === 'en' ? 'bg-[#06b6d4] text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>English</button>
                       <button onClick={() => setActiveLangTab('tr')} className={`flex-1 py-2 rounded-lg font-bold text-xs transition-colors ${activeLangTab === 'tr' ? 'bg-[#06b6d4] text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>Türkçe</button>
                    </div>

                    <input type="text" placeholder={`${t('srvName')} (${activeLangTab.toUpperCase()})`} className="glass-input w-full rounded-xl py-3 px-4 font-bold" value={newItem[`name_${activeLangTab}`]} onChange={e => setNewItem({...newItem, [`name_${activeLangTab}`]: e.target.value})} />
                    <textarea placeholder={`${t('srvDesc')} (${activeLangTab.toUpperCase()})`} rows="3" className="glass-input w-full rounded-xl py-3 px-4 resize-none font-bold" value={newItem[`desc_${activeLangTab}`]} onChange={e => setNewItem({...newItem, [`desc_${activeLangTab}`]: e.target.value})}></textarea>

                    <input type="number" placeholder={t('srvPrice')} className="glass-input w-full rounded-xl py-3 px-4 font-bold" value={newItem.price} onChange={e => setNewItem({...newItem, price: e.target.value})} />
                    <div className="flex gap-2 mt-2">
                       <button onClick={handleAddOrUpdateItem} disabled={loading} className="btn-cyan w-full py-3 rounded-xl font-bold">{t('publish')}</button>
                       {editingServiceId && <button onClick={()=>{setEditingServiceId(null); setNewItem({name_ar:'',name_en:'',name_tr:'',desc_ar:'',desc_en:'',desc_tr:'',price:'',categoryId:'CAT-001'}); setActiveLangTab('ar');}} className="glass-card px-4 text-red-400 hover:bg-red-500/20 font-bold">X</button>}
                    </div>
                 </div>
              </div>
              <div className="lg:col-span-2 space-y-4">
                 <h3 className="text-xl font-bold text-white mb-4">{t('currentSrvs')}</h3>
                 {isFetchingServices ? Array.from({length: 4}).map((_, i) => <SkeletonCard key={i} />) : services.map(srv => {
                    const category = defaultCategories.find(c => c.id === srv.categoryId);
                    const catName = category ? (category[`name_${lang}`] || category.name_ar || category.name) : 'قسم غير محدد';
                    const srvName = srv[`name_${lang}`] || srv.name_ar || srv.name;

                    return (
                    <div key={srv.id} className={`glass-card p-4 flex flex-col md:flex-row justify-between items-center gap-4 border-${lang==='ar'?'r':'l'}-4 border-[#06b6d4]`}>
                       <div className="w-full md:w-auto">
                          <span className="text-xs text-black bg-[#06b6d4] px-3 py-1 rounded-full mb-2 inline-block font-bold">{catName}</span>
                          <p className="font-bold text-white text-lg">{srvName}</p>
                          <p className="text-sm text-green-400 font-bold mt-1" dir="ltr">{formatPrice(srv.price)}</p>
                       </div>
                       <div className="flex gap-2 w-full md:w-auto mt-2 md:mt-0">
                          <button onClick={() => handleEditClick(srv)} className="text-blue-400 flex-1 md:flex-none px-4 py-2 hover:bg-blue-500/20 rounded-xl flex items-center justify-center gap-2 text-sm font-bold border border-blue-500/30 transition-colors"><EditIcon className="w-5 h-5"/> {t('edit')}</button>
                          <button onClick={() => handleDeleteItem(srv.id)} className="text-red-400 flex-1 md:flex-none px-4 py-2 hover:bg-red-500/20 rounded-xl flex items-center justify-center gap-2 text-sm font-bold border border-red-500/30 transition-colors"><Trash2Icon className="w-5 h-5"/> {t('delete')}</button>
                       </div>
                    </div>
                 )})}
              </div>
            </div>
          )}

          {adminViewSection === 'orders' && (
            <div className="space-y-4">
               <div className="flex gap-2 overflow-x-auto scrollbar-hide mb-6 bg-black/40 p-2 rounded-xl border border-white/5">
                  <button onClick={() => {setAdminOrderFilter('all'); setAdminOrdersPage(1)}} className={`px-5 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition-colors ${adminOrderFilter === 'all' ? 'bg-[#06b6d4] text-black' : 'text-gray-400'}`}>{t('filterAll')} ({adminTasks.length})</button>
                  <button onClick={() => {setAdminOrderFilter('pending'); setAdminOrdersPage(1)}} className={`px-5 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition-colors ${adminOrderFilter === 'pending' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-gray-400'}`}>{t('statusPending')}</button>
                  <button onClick={() => {setAdminOrderFilter('progress'); setAdminOrdersPage(1)}} className={`px-5 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition-colors ${adminOrderFilter === 'progress' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'text-gray-400'}`}>{t('statusProgress')}</button>
                  <button onClick={() => {setAdminOrderFilter('completed'); setAdminOrdersPage(1)}} className={`px-5 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition-colors ${adminOrderFilter === 'completed' ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'text-gray-400'}`}>{t('statusDone')}</button>
                  <button onClick={() => {setAdminOrderFilter('rejected'); setAdminOrdersPage(1)}} className={`px-5 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition-colors ${adminOrderFilter === 'rejected' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'text-gray-400'}`}>{t('statusRejected')}</button>
               </div>

               {paginatedOrders.map((task, idx) => {
                  const isTopup = (task.type || '').includes('شحن');
                  return(
                  <div key={idx} className={`glass-card p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-${lang==='ar'?'r':'l'}-4 ${isTopup ? 'border-emerald-500' : 'border-[#06b6d4]'}`}>
                     <div className="flex-1 w-full">
                        <div className="flex items-center gap-3 mb-2">
                           <span className="text-xs bg-white/10 px-3 py-1 rounded-full text-gray-300 font-bold">{task.dateString}</span>
                           <span className={`text-xs font-bold px-3 py-1 rounded-full ${isTopup ? 'bg-emerald-500/20 text-emerald-400' : 'bg-[#06b6d4]/10 text-[#06b6d4]'}`}>{task.serialId}</span>
                        </div>
                        <div className="bg-black/30 p-4 rounded-xl mb-4 border border-white/5 grid grid-cols-1 sm:grid-cols-3 gap-3">
                           <p className="text-sm font-bold text-white"><UserIcon className="w-4 h-4 inline text-gray-400 mx-2"/>{task.clientName}</p>
                           <a href={`https://wa.me/${task.clientWhatsapp}`} target="_blank" className="text-sm font-bold text-green-400 hover:underline" dir="ltr"><PhoneIcon className="w-4 h-4 inline mx-2"/>{task.clientWhatsapp}</a>
                        </div>
                        <h3 className={`text-lg font-black mb-2 ${isTopup ? 'text-emerald-400' : 'text-white'}`}>{task.type}</h3>
                        <p className="text-sm text-gray-400 whitespace-pre-wrap leading-relaxed">{task.details}</p>
                        
                        {task.adminNote && (
                           <div className="mt-3 p-3 bg-purple-500/10 border border-purple-500/20 rounded-lg">
                              <span className="text-purple-400 font-bold text-xs block mb-1">الملاحظة المُرسلة للعميل:</span>
                              <span className="text-gray-300 text-sm font-semibold">{task.adminNote}</span>
                           </div>
                        )}

                        {task.fileUrl && task.fileUrl.startsWith('http') && (<a href={task.fileUrl} target="_blank" className="mt-4 inline-flex items-center gap-2 text-xs font-bold bg-[#06b6d4]/20 text-[#06b6d4] px-4 py-2 rounded-lg transition-colors"><EyeIcon className="w-4 h-4"/> {t('viewAttach')}</a>)}
                     </div>
                     <div className="w-full md:w-56">
                        <label className="text-xs text-gray-400 font-bold mb-2 block">{t('updateStatus')}</label>
                        <select className={`glass-input w-full rounded-xl py-3 px-4 text-sm font-bold outline-none cursor-pointer ${(task.status||'').includes('مكتمل') ? 'text-green-400 border-green-500/50 bg-green-500/10' : 'text-[#06b6d4] border-[#06b6d4]/50'}`} value={task.status || 'قيد المراجعة ⏳'} onChange={(e) => handleStatusChange(task, e.target.value)}>
                           <option value="قيد المراجعة ⏳" className="bg-gray-900 text-amber-400">{t('statusPending')}</option>
                           <option value="جاري التنفيذ 🚀" className="bg-gray-900 text-blue-400">{t('statusProgress')}</option>
                           <option value="تم الحل / مكتمل ✅" className="bg-gray-900 text-green-400">{t('statusDone')}</option>
                           <option value="مرفوض ❌" className="bg-gray-900 text-red-400">{t('statusRejected')}</option>
                        </select>
                        {((task.status || '').includes('مكتمل') && !isTopup) && (
                            <button onClick={() => generatePDFInvoice(task)} className="mt-3 w-full text-xs font-bold text-white bg-blue-600/30 border border-blue-500/50 hover:bg-blue-600/50 px-3 py-2 rounded-lg flex justify-center items-center gap-1 transition-colors"><DownloadIcon className="w-4 h-4"/> PDF</button>
                        )}
                     </div>
                  </div>
               )})}
               
               {totalOrderPages > 1 && (
                  <div className="flex justify-center gap-2 mt-4">
                     <button onClick={() => setAdminOrdersPage(p => Math.max(1, p - 1))} disabled={adminOrdersPage===1} className="px-4 py-2 glass-card text-sm font-bold hover:bg-white/10">{t('prev')}</button>
                     <span className="px-4 py-2 text-[#06b6d4] font-bold">{t('page')} {adminOrdersPage} / {totalOrderPages}</span>
                     <button onClick={() => setAdminOrdersPage(p => Math.min(totalOrderPages, p + 1))} disabled={adminOrdersPage===totalOrderPages} className="px-4 py-2 glass-card text-sm font-bold hover:bg-white/10">{t('next')}</button>
                  </div>
               )}
            </div>
          )}

          {adminViewSection === 'settings' && (
            <div className="space-y-8">
               
               <div className="glass-card p-8 border-t-4 border-t-purple-500">
                  <h3 className="text-2xl font-black mb-4 text-white flex items-center gap-2"><GiftIcon className="text-purple-400 w-8 h-8"/> {t('manageBonuses')}</h3>
                  <p className="text-sm text-gray-400 mb-6">{t('manageBonusesDesc')}</p>
                  
                  <div className="flex flex-wrap gap-4 items-end mb-6 bg-black/30 p-4 rounded-xl border border-white/5">
                     <div className="flex-1 min-w-[150px]">
                        <label className="text-xs text-gray-400 font-bold mb-1 block">{t('whenTopup')}</label>
                        <input type="number" className="glass-input w-full rounded-xl py-3 px-4 font-bold" placeholder="مثال: 50" value={newTier.threshold} onChange={e=>setNewTier({...newTier, threshold: e.target.value})} />
                     </div>
                     <div className="flex-1 min-w-[150px]">
                        <label className="text-xs text-green-400 font-bold mb-1 block">{t('bonusValue')}</label>
                        <input type="number" className="glass-input w-full rounded-xl py-3 px-4 font-bold text-green-400" placeholder="مثال: 10" value={newTier.bonus} onChange={e=>setNewTier({...newTier, bonus: e.target.value})} />
                     </div>
                     <button onClick={() => {
                         if(newTier.threshold && newTier.bonus) {
                            setBonusTiers(prev => [...prev, {threshold: parseFloat(newTier.threshold), bonus: parseFloat(newTier.bonus)}].sort((a,b)=>b.threshold-a.threshold));
                            setNewTier({threshold:'', bonus:''});
                         }
                     }} className="bg-purple-500/20 text-purple-400 hover:bg-purple-500/30 px-6 py-3 rounded-xl font-bold border border-purple-500/30 transition-colors">{t('addOfferBtn')}</button>
                  </div>

                  <div className="space-y-3 mb-6">
                     {bonusTiers.sort((a,b)=>b.threshold-a.threshold).map((tier, idx) => (
                        <div key={idx} className="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/10">
                           <div className="font-bold text-sm">
                              {t('topupGet')} <span className="text-[#06b6d4]">${tier.threshold}</span> <ArrowRightIcon className={`inline w-4 h-4 mx-2 ${lang==='ar'?'rotate-180':''}`} /> {t('getBonus')} <span className="text-green-400">${tier.bonus}</span>
                           </div>
                           <button onClick={()=>setBonusTiers(bonusTiers.filter((_, i) => i !== idx))} className="text-red-400 p-2 hover:bg-red-500/20 rounded-lg"><Trash2Icon className="w-4 h-4"/></button>
                        </div>
                     ))}
                  </div>

                  <button onClick={handleSaveBonusTiers} disabled={loading} className="w-full bg-purple-600/80 hover:bg-purple-600 text-white py-3 rounded-xl font-bold transition-colors">{t('saveOffersBtn')}</button>
               </div>

               <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="glass-card p-8 border-t-4 border-t-[#06b6d4]">
                     <h3 className="text-2xl font-black mb-4 text-white flex items-center gap-2"><DollarSignIcon className="text-[#06b6d4] w-8 h-8"/> Rate (USD/SYP)</h3>
                     <div className="flex flex-col sm:flex-row gap-4 items-center">
                        <input type="number" className="glass-input w-full rounded-xl py-4 px-4 text-xl font-black text-white" value={newExchangeRateInput} onChange={e => setNewExchangeRateInput(e.target.value)} />
                        <button onClick={handleUpdateExchangeRate} disabled={loading} className="btn-cyan px-10 py-4 rounded-xl font-bold flex justify-center items-center gap-2">حفظ</button>
                     </div>
                  </div>
               </div>

               <div className="glass-card p-8 border-t-4 border-t-red-500">
                  <h3 className="text-2xl font-black mb-6 text-white flex items-center gap-2"><SettingsIcon className="text-red-400 w-8 h-8"/> إدارة النظام والبيانات المتقدمة</h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                     <div className="bg-black/30 p-6 rounded-xl border border-white/5">
                        <h4 className="font-bold text-emerald-400 mb-2">تصدير البيانات (النسخ الاحتياطي)</h4>
                        <p className="text-xs text-gray-400 mb-4">تحميل كافة بيانات العملاء والطلبات كملف CSV قابل للفتح في برنامج Excel.</p>
                        <button onClick={handleExportData} disabled={loading} className="w-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30 py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                           <DownloadIcon className="w-5 h-5"/> تصدير قاعدة البيانات (Excel)
                        </button>
                     </div>

                     <div className="bg-black/30 p-6 rounded-xl border border-red-500/10">
                        <h4 className="font-bold text-red-500 mb-2">استعادة ضبط المصنع</h4>
                        <p className="text-xs text-gray-400 mb-4">هذا الإجراء سيقوم بحذف <span className="text-red-400 font-bold">جميع</span> العملاء، الطلبات، والخدمات نهائياً من قاعدة بيانات Firebase.</p>
                        <button onClick={handleFactoryReset} disabled={loading} className="w-full bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600/40 py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                           <Trash2Icon className="w-5 h-5"/> مسح كافة بيانات النظام
                        </button>
                     </div>
                  </div>
               </div>
            </div>
          )}
        </div>
      );
      };

      return (
        <div className="relative min-h-screen selection:bg-[#06b6d4]/30 flex flex-col">
          <style>{customStyles}</style>
          
          <div className="tech-animated-bg"></div>
          <div className="glowing-orb"></div>
          <div className="glowing-orb-2"></div>
          
          {renderWelcomePromo()}
          {renderDialog()}
          {toastMessage && <div className="fixed top-6 right-1/2 translate-x-1/2 z-[9999] glass-card bg-green-900/40 border-green-500/50 px-6 py-4 flex items-center gap-3 shadow-[0_0_20px_rgba(16,185,129,0.3)]"><CheckCircleIcon className="text-green-400 w-6 h-6" /><span className="font-bold text-sm text-white">{toastMessage}</span></div>}
          
          {isCartOpen && renderCartModal()}
          
          <div className="flex-grow">
            {currentView === 'login' && !showAdminLogin && renderLogin()}
            {currentView === 'register' && !showAdminLogin && renderRegister()}
            {currentView === 'about' && !showAdminLogin && renderAbout()}
            {currentView === 'terms' && !showAdminLogin && renderTerms()}
            {currentView === 'wallet' && !showAdminLogin && renderWallet()}
            {currentView === 'mainHub' && !activeCategory && !showAdminLogin && renderMainHub()}
            {currentView === 'mainHub' && activeCategory && !showAdminLogin && renderCategoryView()}
            {currentView === 'adminDashboard' && renderAdminDashboard()}
          </div>

          {showAdminLogin && currentView !== 'adminDashboard' && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-[fadeIn_0.3s_ease-out]">
               <div className="glass-card w-full max-w-sm p-8 text-center border-red-500/50 shadow-[0_0_40px_rgba(239,68,68,0.2)]">
                  <LockIcon className="w-10 h-10 text-red-500 mx-auto mb-4" />
                  <h3 className="text-xl font-bold mb-2">{t('adminGateway')}</h3>
                  <p className="text-sm text-gray-400 mb-6">{t('adminMsg')}</p>
                  <form onSubmit={handleAdminLogin}>
                    <input type="password" placeholder="PIN" className="glass-input w-full rounded-xl py-3 text-center tracking-widest font-bold mb-4" value={adminPin} onChange={e=>setAdminPin(e.target.value)} />
                    <div className="flex gap-2">
                       <button type="button" onClick={() => setShowAdminLogin(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-400">{t('cancel')}</button>
                       <button type="submit" disabled={loading} className="flex-1 bg-red-500/20 text-red-400 font-bold py-3 rounded-xl border border-red-500/30">{t('safeLogin')}</button>
                    </div>
                  </form>
               </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
