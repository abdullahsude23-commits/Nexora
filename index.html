    const SkeletonCard = () => (

         <div className="space-y-3"><div className="h-4 bg-white/10 rounded w-3/4"></div><div className="h-3 bg-white/5 rounded w-full"></div><div className="h-3 bg-white/5 rounded w-5/6"></div></div>

    function App() {
      const [lang, setLang] = useState('ar');
      const t = (key) => (locales[lang] && locales[lang][key]) ? locales[lang][key] : locales['ar'][key];
      const [currentView, setCurrentView] = useState('mainHub');
      const [showWelcomePromo, setShowWelcomePromo] = useState(false);
      
      const [userData, setUserData] = useState(() => {
          const saved = localStorage.getItem('nexoraSession');
          return saved ? JSON.parse(saved) : null;
      }); 
      
      const [loginInput, setLoginInput] = useState(''); 
      const [loginPassword, setLoginPassword] = useState(''); 
      const [registerData, setRegisterData] = useState({ name: '', whatsapp: '', area: '', password: '' });
      const [loading, setLoading] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null, inputType: 'password', inputPlaceholder: '' });

      const hashPassword = async (password) => {
         const msgBuffer = new TextEncoder().encode(password);
         const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
         const hashArray = Array.from(new Uint8Array(hashBuffer));
         return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      };

      const defaultCategories = [
         { id: 'CAT-001', name_ar: 'البرمجة والتطوير', name_en: 'Development', name_tr: 'Geliştirme', icon: 'Code', color: 'blue' },
         { id: 'CAT-002', name_ar: 'تصميم وإبداع', name_en: 'Design & Creativity', name_tr: 'Tasarım ve Yaratıcılık', icon: 'PenTool', color: 'purple' },
         { id: 'CAT-003', name_ar: 'تسويق رقمي', name_en: 'Digital Marketing', name_tr: 'Dijital Pazarlama', icon: 'Megaphone', color: 'cyan' },
         { id: 'CAT-004', name_ar: 'شحن ألعاب', name_en: 'Game Top-up', name_tr: 'Oyun Yükleme', icon: 'ShoppingBag', color: 'orange' },
         { id: 'CAT-005', name_ar: 'اشتراكات برامج', name_en: 'Software Subscriptions', name_tr: 'Yazılım Abonelikleri', icon: 'ShieldCheck', color: 'green' },
         { id: 'CAT-006', name_ar: 'خدمات طلابية', name_en: 'Student Services', name_tr: 'Öğrenci Hizmetleri', icon: 'FileText', color: 'indigo' },
         { id: 'CAT-007', name_ar: 'فواتير', name_en: 'Invoices', name_tr: 'Faturalar', icon: 'Activity', color: 'yellow' },
         { id: 'CAT-008', name_ar: 'شبكة إنترنت', name_en: 'Internet Network', name_tr: 'İnternet Ağı', icon: 'Headphones', color: 'blue' }
      ];
      
      const [services, setServices] = useState([]);
      const [activeCategory, setActiveCategory] = useState(null);
      const [isFetchingServices, setIsFetchingServices] = useState(true);

      const [cart, setCart] = useState(() => {
          const saved = localStorage.getItem('nexoraCart');
          return saved ? JSON.parse(saved) : [];
      });
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [discountInfo, setDiscountInfo] = useState({ active: false, percent: 0 }); 
      const [topupAmount, setTopupAmount] = useState('');
      const [receiptFile, setReceiptFile] = useState(null); 
      const [paymentMethod, setPaymentMethod] = useState('bank');
      const [userTransactions, setUserTransactions] = useState([]);

      const [userRequests, setUserRequests] = useState([]);
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [adminPin, setAdminPin] = useState('');
      const [adminTasks, setAdminTasks] = useState([]);
      const [adminClients, setAdminClients] = useState([]);
      const [adminViewSection, setAdminViewSection] = useState('overview');
      const [adminOrderFilter, setAdminOrderFilter] = useState('all'); 
      const [newItem, setNewItem] = useState({ name_ar: '', name_en: '', name_tr: '', desc_ar: '', desc_en: '', desc_tr: '', price: '', categoryId: 'CAT-001' });
      const [editingServiceId, setEditingServiceId] = useState(null);
      const [activeLangTab, setActiveLangTab] = useState('ar');
      const [editingClient, setEditingClient] = useState(null); 

      const [adminClientsPage, setAdminClientsPage] = useState(1);
      const [adminOrdersPage, setAdminOrdersPage] = useState(1);
      const itemsPerPage = 10;

      const [currency, setCurrency] = useState('USD');
      const [exchangeRate, setExchangeRate] = useState(15000);
      const [newExchangeRateInput, setNewExchangeRateInput] = useState('');
      
      const [bonusTiers, setBonusTiers] = useState([{threshold: 25, bonus: 5}, {threshold: 50, bonus: 10}, {threshold: 100, bonus: 25}]);
      const [newTier, setNewTier] = useState({threshold: '', bonus: ''});

      const previousTaskCount = useRef(0);

      const showAlert = (message) => setDialog({ isOpen: true, type: 'alert', message, onConfirm: null });
      const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, type: 'confirm', message, onConfirm });
      const showPrompt = (message, onConfirm, inputType = 'password', inputPlaceholder = 'أدخل الرمز السري') => {
          setDialog({ isOpen: true, type: 'prompt', message, onConfirm, inputType, inputPlaceholder });
      };
      const closeDialog = () => setDialog({ isOpen: false, type: 'alert', message: '', onConfirm: null });

      useEffect(() => {
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      }, [lang]);

      const handleFileUpload = (e, setter) => {
        const file = e.target.files[0];
        if(!file) return;
        if(file.size > 3 * 1024 * 1024) { showAlert('الحد الأقصى 3 ميجابايت.'); return; }
        setter(file);
      };

      useEffect(() => {
          if (userData) {
              const sessionData = { ...userData };
              delete sessionData.password;
              localStorage.setItem('nexoraSession', JSON.stringify(sessionData));
          } else {
              localStorage.removeItem('nexoraSession');
          }
      }, [userData]);

      useEffect(() => {
          localStorage.setItem('nexoraCart', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
          if (!sessionStorage.getItem('nexoraWelcomeShown')) {
              setShowWelcomePromo(true);
              sessionStorage.setItem('nexoraWelcomeShown', 'true');
          }
      }, []);

      useEffect(() => {
        const loadInitialData = async () => {
           try {
               const settingsDoc = await db.collection('settings').doc('globals').get();
               if (settingsDoc.exists) {
                   const data = settingsDoc.data();
                   if (data.exchangeRate) { setExchangeRate(data.exchangeRate); setNewExchangeRateInput(data.exchangeRate); }
                   if (data.bonusTiers) { setBonusTiers(data.bonusTiers); }
               }
           } catch (e) { console.error("Error loading settings", e); }
        };

        const unsubscribeServices = db.collection('services').onSnapshot((snapshot) => {
           const servs = [];
           snapshot.forEach(doc => servs.push({ id: doc.id, ...doc.data() }));
           setServices(servs); setIsFetchingServices(false);
        });

        const handleHashChange = () => {
            const hash = window.location.hash;
            if(hash.includes('admin-gateway')) { setShowAdminLogin(true); } 
            else if (hash.startsWith('#/cat-')) {
                const catId = hash.replace('#/cat-', '');
                const foundCat = defaultCategories.find(c => c.id === catId);
                if (foundCat) { setActiveCategory(foundCat); setCurrentView('mainHub'); } 
                else { setCurrentView('mainHub'); setActiveCategory(null); }
            } else if (hash === '#/login') { setCurrentView('login'); setActiveCategory(null);
            } else if (hash === '#/register') { setCurrentView('register'); setActiveCategory(null);
            } else if (hash === '#/about') { setCurrentView('about'); setActiveCategory(null);
            } else if (hash === '#/terms') { setCurrentView('terms'); setActiveCategory(null);
            } else if (hash === '#/wallet') { setCurrentView('wallet'); setActiveCategory(null);
            } else if (hash === '#admin-dashboard') { setCurrentView('adminDashboard'); setShowAdminLogin(false);
            } else { setCurrentView('mainHub'); setActiveCategory(null); }
        };

        window.addEventListener('hashchange', handleHashChange);
        handleHashChange(); 
        loadInitialData();

        return () => { window.removeEventListener('hashchange', handleHashChange); unsubscribeServices(); };
      }, []);

      useEffect(() => {
        if (!showAdminLogin && currentView === 'adminDashboard') {
            const unsubscribeOrders = db.collection('requests').onSnapshot((snapshot) => {
                const allTasks = [];
                snapshot.forEach(doc => allTasks.push({ id: doc.id, ...doc.data() }));
                allTasks.sort((a, b) => b.timestamp - a.timestamp);
                
                if (previousTaskCount.current !== 0 && allTasks.length > previousTaskCount.current) {
                    setToastMessage('🔔 تنبيه: تم استلام طلب جديد!');
                    setTimeout(()=>setToastMessage(''), 5000);
                }
                previousTaskCount.current = allTasks.length;
                setAdminTasks(allTasks);
            });
            const unsubscribeClients = db.collection('clients').onSnapshot((snapshot) => {
                const clients = [];
                snapshot.forEach(doc => clients.push({ id: doc.id, ...doc.data() }));
                clients.sort((a, b) => b.timestamp - a.timestamp);
                setAdminClients(clients);
            });
            return () => { unsubscribeOrders(); unsubscribeClients(); };
        }
      }, [currentView, showAdminLogin]);

      useEffect(() => {
         if (userData && userData.serialId) {
             const unsubscribeUserReqs = db.collection('requests').where('serialId', '==', userData.serialId).onSnapshot((snapshot) => {
                 const reqs = [];
                 snapshot.forEach(doc => reqs.push({ id: doc.id, ...doc.data() }));
                 reqs.sort((a, b) => b.timestamp - a.timestamp);
                 setUserRequests(reqs);
             });
             const unsubscribeTrans = db.collection('transactions').where('serialId', '==', userData.serialId).onSnapshot((snapshot) => {
                 const trans = [];
                 snapshot.forEach(doc => trans.push({ id: doc.id, ...doc.data() }));
                 trans.sort((a, b) => b.timestamp - a.timestamp);
                 setUserTransactions(trans);
             });
             const unsubscribeClient = db.collection('clients').doc(userData.serialId).onSnapshot((doc) => {
                 if(doc.exists) {
                     setUserData(prev => prev ? {...prev, balance: parseFloat(doc.data().balance) || 0} : null);
                 }
             });
             return () => { unsubscribeUserReqs(); unsubscribeTrans(); unsubscribeClient(); };
         } else { setUserRequests([]); setUserTransactions([]); }
      }, [userData ? userData.serialId : null]);

      const changeView = (view, cat = null) => {
         if (cat) window.location.hash = `/cat-${cat.id}`;
         else if (view === 'mainHub') window.location.hash = '';
         else window.location.hash = `#/${view}`;
      };

      const formatPrice = (usdAmount) => {
        const val = parseFloat(usdAmount) || 0;
        if (currency === 'SYP') return (val * exchangeRate).toLocaleString('en-US') + ' ل.س';
        return '$' + val.toFixed(2);
      };

      const calculateBonus = (amount) => {
          const val = parseFloat(amount) || 0;
          const sortedTiers = [...bonusTiers].sort((a, b) => b.threshold - a.threshold);
          const matchingTier = sortedTiers.find(tier => val >= tier.threshold);
          return matchingTier ? parseFloat(matchingTier.bonus) : 0;
      };

      const generatePDFInvoice = (order) => {
         const element = document.createElement('div');
         const isAr = lang === 'ar';
         element.innerHTML = `
            <div style="font-family: 'Cairo', sans-serif; direction: ${isAr ? 'rtl' : 'ltr'}; padding: 30px; color: #333; background: #fff; width: 800px; max-width: 100%;">
               <div style="text-align: center; border-bottom: 3px solid #06b6d4; padding-bottom: 20px; margin-bottom: 30px;">
                  <h1 style="color: #06b6d4; font-size: 38px; margin: 0; font-weight: 900; letter-spacing: 2px;">NEXORA SYRIA</h1>
                  <p style="color: #666; font-size: 16px; margin-top: 5px;">فاتورة خدمات رقمية رسمية / Official Digital Service Invoice</p>
               </div>
               <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 15px;">
                  <tr>
                     <td style="padding: 10px; width: 50%;"><strong>رقم الفاتورة (Invoice ID):</strong><br> ${order.serialId}</td>
                     <td style="padding: 10px; text-align: ${isAr ? 'left' : 'right'}; width: 50%;"><strong>تاريخ الإصدار (Date):</strong><br> ${order.dateString}</td>
                  </tr>
                  <tr>
                     <td style="padding: 10px; width: 50%;"><strong>اسم العميل (Client Name):</strong><br> ${order.clientName}</td>
                     <td style="padding: 10px; text-align: ${isAr ? 'left' : 'right'}; width: 50%; color: #10b981;"><strong>الحالة (Status):</strong><br> ${order.status}</td>
                  </tr>
               </table>
               <div style="background-color: #f8f9fa; padding: 25px; border-radius: 12px; border: 1px solid #e5e7eb;">
                  <h3 style="margin-top: 0; color: #1f2937; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; font-size: 18px;">تفاصيل الطلب / Order Details</h3>
                  <div style="white-space: pre-wrap; font-size: 15px; line-height: 1.8; color: #4b5563; margin-top: 15px;">${order.details}</div>
               </div>

      const uploadToStorage = async (fileObj) => {
          try {
             const fileRef = storage.ref().child(`nexora_receipts/${Date.now()}_${fileObj.name}`);
             await fileRef.put(fileObj); 
             return await fileRef.getDownloadURL();
          } catch(e) { throw new Error("تخزين Firebase مغلق. تأكد من إعدادات Storage Rules."); }
      };

      const handleExportData = () => {
         setLoading(true); setToastMessage('جاري تجميع البيانات وتجهيز الملف...');
         try {
            let csv = "\uFEFF"; 
            csv += "--- Clients ---\nID,Name,WhatsApp,Area,Balance(USD),Date\n";
            adminClients.forEach(c => csv += `${c.serialId},${c.name},${c.whatsapp},${c.area},${c.balance},${c.dateString}\n`);
            csv += "\n--- Orders ---\nID,Client,Type,Total(USD),Status,Date\n";
            adminTasks.forEach(t => csv += `${t.id},${t.clientName},${t.type},${t.total},${t.status},${t.dateString}\n`);
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `NEXORA_Backup_${new Date().toLocaleDateString('en-GB')}.csv`;
            link.click();
            setToastMessage('تم تحميل النسخة الاحتياطية بنجاح!');
         } catch(e) { showAlert('حدث خطأ أثناء تصدير البيانات.'); }
         setLoading(false); setTimeout(() => setToastMessage(''), 3000);
      };

      const handleFactoryReset = () => {
         showPrompt('⚠️ تحذير خطير: سيتم مسح كافة بيانات العملاء، الطلبات، والخدمات. هذا الإجراء نهائي! أدخل الرمز السري للتأكيد:', async (pin) => {
             const settingsDoc = await db.collection('settings').doc('globals').get();
             const correctPin = settingsDoc.exists && settingsDoc.data().adminPin ? settingsDoc.data().adminPin : '2026';
             
             if (pin !== correctPin) return showAlert('إلغاء الإجراء: الرمز السري غير صحيح.');
             
             setLoading(true); setToastMessage('جاري مسح النظام بالكامل... الرجاء عدم إغلاق الصفحة.');
             try {
                const collections = ['clients', 'requests', 'transactions', 'services'];
                for(const col of collections) {
                   const snapshot = await db.collection(col).get();
                   const batch = db.batch();
                   snapshot.docs.forEach(doc => { batch.delete(doc.ref); });
                   await batch.commit();
                }
                setToastMessage('نجاح: تم مسح كافة البيانات واستعادة ضبط المصنع.');
             } catch(e) { showAlert('خطأ أثناء عملية المسح.'); }
             setLoading(false); setTimeout(() => setToastMessage(''), 4000);
         }, 'password', 'أدخل الرمز السري لتأكيد المسح');
      };

      // --- نظام التسجيل واستعادة الحساب المحدث ---
      const handleRegister = async (e) => {
        e.preventDefault(); setLoading(true);
        try {
           const fakeEmail = `${registerData.whatsapp}@nexora.sy`;
           
           // إنشاء الحساب في Authentication
           const userCredential = await auth.createUserWithEmailAndPassword(fakeEmail, registerData.password);
           const firebaseUser = userCredential.user;

           // التحقق من وجود العميل في Firestore
           const existSnap = await db.collection('clients').where('whatsapp', '==', registerData.whatsapp).get();
           
           if (!existSnap.empty) { 
               // --- سيناريو استعادة الحساب (عند قيام الإدارة بحذفه من Auth) ---
               const oldDoc = existSnap.docs[0];
               const clientData = oldDoc.data();
               
               await db.collection('clients').doc(clientData.serialId).update({ uid: firebaseUser.uid });
               
               setUserData({...clientData, uid: firebaseUser.uid});
               changeView('mainHub'); 
               setToastMessage('تم استعادة حسابك وربط بياناتك السابقة بنجاح!');
           } else {
               // --- سيناريو التسجيل العادي ---
               const newSerial = 'NEX-' + Math.floor(10000 + Math.random() * 90000);
               const newClient = { 
                   ...registerData, 
                   serialId: newSerial, balance: 0, timestamp: Date.now(), 
                   dateString: new Date().toLocaleDateString('ar-SA'),
                   uid: firebaseUser.uid
               };
               
               delete newClient.password; // عدم حفظ الباسورد إطلاقاً لدواعي الأمان
               await db.collection('clients').doc(newSerial).set(newClient);
               
               setUserData(newClient); 
               changeView('mainHub'); 
               setToastMessage('تم تسجيل الحساب بنجاح بآلية الأمان المتقدمة!');
           }
        } catch (error) { 
           if (error.code === 'auth/email-already-in-use') {
               showAlert('هذا الرقم مسجل مسبقاً. إذا نسيت كلمة المرور، تواصل مع الإدارة لطلب "تصفير الأمان واستعادة الحساب".');
           } else if (error.code === 'auth/weak-password') {
               showAlert('كلمة المرور ضعيفة جداً! يجب أن تتكون من 6 أحرف أو أرقام على الأقل.');
           } else if (error.code === 'auth/operation-not-allowed') {
               showAlert('خدمة تسجيل الدخول معطلة من قبل الإدارة في Firebase. يرجى تفعيل Email/Password Provider.');
           } else {
               showAlert('حدث خطأ أثناء التسجيل: ' + error.message);
           }
        }
        setLoading(false); setTimeout(() => setToastMessage(''), 3000);
      };

      const handleLoginAction = async (e) => {
        e.preventDefault(); setLoading(true);
        const fakeEmail = `${loginInput}@nexora.sy`;
        
        try {
           await auth.signInWithEmailAndPassword(fakeEmail, loginPassword);
           const waQuery = await db.collection('clients').where('whatsapp', '==', loginInput).get();
           if (!waQuery.empty) {
               setUserData(waQuery.docs[0].data());
               changeView('mainHub'); setToastMessage('أهلاً بك مجدداً!');
           } else {
               await auth.signOut();
               showAlert('عذراً! حسابك موجود في خوادم الأمان ولكن تعذر العثور على ملف بياناتك في قاعدة البيانات (Firestore). يرجى مراجعة الإدارة.');
           }
        } catch (error) {
           if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
               try {
                   const waQuery = await db.collection('clients').where('whatsapp', '==', loginInput).get();
                   let userDoc = null; if (!waQuery.empty) userDoc = waQuery.docs[0].data();
                   if (!userDoc) { showAlert('لم يتم العثور على حساب مرتبط بهذا الرقم.'); setLoading(false); return; }
                   
                   const hashedLoginInput = await hashPassword(loginPassword);
                   if (userDoc.password !== loginPassword && userDoc.password !== hashedLoginInput) { 
                       showAlert('كلمة المرور غير صحيحة!'); setLoading(false); return; 
                   }
                   
                   const userCredential = await auth.createUserWithEmailAndPassword(fakeEmail, loginPassword);
                   await db.collection('clients').doc(userDoc.serialId).update({ uid: userCredential.user.uid, password: firebase.firestore.FieldValue.delete() });
                   
                   const sessionData = { ...userDoc, uid: userCredential.user.uid };
                   delete sessionData.password; setUserData(sessionData); 
                   changeView('mainHub'); setToastMessage('أهلاً بك مجدداً! (تم ترقية أمان حسابك تلقائياً)');
               } catch (err) {
                   if (err.code === 'auth/email-already-in-use') showAlert('تعذر الدخول. يرجى طلب "تصفير الأمان" من الإدارة.');
                   else showAlert('حدث خطأ غير متوقع: ' + err.message);
               }
           } else {
               if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') showAlert('كلمة المرور غير صحيحة.');
               else if (error.code === 'auth/too-many-requests') showAlert('تم حظر هذا الحساب مؤقتاً بسبب محاولات دخول فاشلة كثيرة. يرجى المحاولة لاحقاً.');
               else showAlert('فشل تسجيل الدخول: ' + error.message);
           }
        }
        setLoading(false); setTimeout(() => setToastMessage(''), 3000);
      };

      const logout = () => {
        showConfirm('هل أنت متأكد من تسجيل الخروج؟', async () => {
            await auth.signOut();
            localStorage.removeItem('nexoraSession'); setUserData(null); setCart([]); changeView('mainHub');
        });
      };

      const handleTopUpRequest = async (e) => {
         e.preventDefault();
         if (!receiptFile && paymentMethod === 'bank') return showAlert(t('attachReceipt'));
         if (!topupAmount || parseFloat(topupAmount) <= 0) return showAlert(t('enterAmount'));
         setLoading(true);
         try {
             let receiptUrl = null; 
             if (receiptFile) receiptUrl = await uploadToStorage(receiptFile);
             
             const baseAmt = parseFloat(topupAmount) || 0;
             const bonusAmt = calculateBonus(baseAmt);
             const finalTotal = baseAmt + bonusAmt;

             let detailsTxt = `طلب شحن محفظة بقيمة ${baseAmt}$ عبر ${paymentMethod === 'bank' ? 'حوالة/شام كاش' : 'نقدي'}`;
             if (bonusAmt > 0) {
                 detailsTxt += `\n🎁 قيمة المكافأة الممنوحة: ${bonusAmt}$`;
                 detailsTxt += `\n💰 الإجمالي الذي سيضاف للرصيد: ${finalTotal}$`;
             }

             const reqData = {
                 serialId: userData.serialId || 'غير-محدد', clientName: userData.name || 'عميل', 
                 clientWhatsapp: userData.whatsapp || '', clientArea: userData.area || '',
                 type: 'شحن رصيد محفظة', details: detailsTxt,
                 total: finalTotal, baseAmount: baseAmt, bonusAmount: bonusAmt,
                 fileUrl: receiptUrl || null,
                 status: 'قيد المراجعة ⏳', timestamp: Date.now(), dateString: new Date().toLocaleDateString('ar-SA')
             };
             await db.collection('requests').add(reqData);
             setTopupAmount(''); setReceiptFile(null);
             setToastMessage('تم استلام طلب الشحن. سيتم إضافة المبلغ مع المكافأة فور تأكيده!');
         } catch(e) { showAlert('حدث خطأ: ' + e.message); }
         setLoading(false); setTimeout(() => setToastMessage(''), 4000);
      };

      const handleAddToCart = (item) => {
        setCart((prev) => [...prev, item]);
        const itemName = item[`name_${lang}`] || item.name_ar || item.name || 'خدمة';
        setToastMessage(`تمت إضافة "${itemName}" للسلة`); setTimeout(() => setToastMessage(''), 3000);
      };

      const handleRequestService = (item) => {
         if (!userData) { showAlert('يجب تسجيل الدخول لطلب الخدمات.'); changeView('login'); } 
         else { handleAddToCart(item); }
      };

      const handleCheckoutFromWallet = async () => {
          const rawTotal = cart.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0);
          const percentVal = parseFloat(discountInfo.percent) || 0;
          const finalTotal = discountInfo.active ? rawTotal - (rawTotal * (percentVal / 100)) : rawTotal;

          setLoading(true);
          try {
              const clientRef = db.collection('clients').doc(userData.serialId);
              let newReqId = '';

              await db.runTransaction(async (transaction) => {
                  const clientDoc = await transaction.get(clientRef);
                  if (!clientDoc.exists) throw new Error("بيانات العميل غير متوفرة");

                  const currentBalance = parseFloat(clientDoc.data().balance) || 0;
                  if (currentBalance < finalTotal) throw new Error("INSUFFICIENT_FUNDS");

                  transaction.update(clientRef, { balance: currentBalance - finalTotal });

                  let detailsText = `[دفع مباشر من المحفظة الذكية]\n\n`;
                  cart.forEach(item => { detailsText += `- ${item.name_ar || item.name || 'خدمة غير محددة'} (${parseFloat(item.price) || 0} $)\n`; });
                  
                  const reqRef = db.collection('requests').doc();
                  newReqId = reqRef.id;
                  const transRef = db.collection('transactions').doc();

                  transaction.set(reqRef, {
                      serialId: userData.serialId || 'غير-محدد', clientName: userData.name || 'عميل', 
                      clientWhatsapp: userData.whatsapp || '', clientArea: userData.area || '',
                      type: 'طلب متجر وخدمات', details: detailsText, total: finalTotal || 0, fileUrl: null,
                      status: 'قيد المراجعة ⏳', timestamp: Date.now(), dateString: new Date().toLocaleDateString('ar-SA')
                  });

                  transaction.set(transRef, {
                      serialId: userData.serialId, type: 'سداد 🔴', amount: finalTotal, desc: `سداد قيمة طلب (${newReqId.substring(0,6)})`,
                      timestamp: Date.now(), dateString: new Date().toLocaleString('ar-SA')
                  });
              });

              setIsCartOpen(false); setCart([]); setDiscountInfo({ active: false, percent: 0 });
              setToastMessage('تم خصم المبلغ وتأكيد الطلب بنجاح تام!');
          } catch(e) { 
              if (e.message === "INSUFFICIENT_FUNDS") showAlert(t('insufficient'));
              else showAlert('حدث خطأ أمني أثناء إتمام الطلب: ' + e.message); 
          }
          setLoading(false); setTimeout(() => setToastMessage(''), 4000);
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault(); setLoading(true);
        try {
            const settingsDoc = await db.collection('settings').doc('globals').get();
            const correctPin = settingsDoc.exists && settingsDoc.data().adminPin ? settingsDoc.data().adminPin : '2026';
            if (adminPin === correctPin) { setShowAdminLogin(false); setCurrentView('adminDashboard'); window.location.hash = '#admin-dashboard'; } 
            else { showAlert('الرمز السري غير صحيح.'); }
        } catch(error) { showAlert('حدث خطأ في الاتصال بالخادم.'); }
        setLoading(false);

      const handleUpdateClientData = async (e) => {
          e.preventDefault(); if(!editingClient) return; setLoading(true);
          try {
             await db.collection('clients').doc(editingClient.serialId).update({
                 name: editingClient.name, whatsapp: editingClient.whatsapp, area: editingClient.area, balance: parseFloat(editingClient.balance) || 0
             });
             setToastMessage('تم تحديث بيانات العميل بنجاح!'); setEditingClient(null);
          } catch(error) { showAlert('حدث خطأ أثناء تحديث العميل.'); }
          setLoading(false); setTimeout(() => setToastMessage(''), 3000);
      };

      const handleStatusChange = async (task, newStatus) => {
        if (task.status === newStatus) return;
        const processChange = async (noteVal) => {
            try {
               const clientRef = db.collection('clients').doc(task.serialId);
               const reqRef = db.collection('requests').doc(task.id);
               const taskTotal = parseFloat(task.total) || 0;

               if ((task.type || '').includes('شحن') && newStatus.includes('مكتمل') && !(task.status || '').includes('مكتمل')) {
                   await clientRef.update({ balance: firebase.firestore.FieldValue.increment(taskTotal) });
                   await db.collection('transactions').add({ serialId: task.serialId, type: 'إيداع 🟢', amount: taskTotal, desc: `شحن رصيد معتمد (${task.id.substring(0,6)})`, timestamp: Date.now(), dateString: new Date().toLocaleString('ar-SA') });
               } else if (!(task.type || '').includes('شحن') && newStatus.includes('مرفوض') && !(task.status || '').includes('مرفوض')) {
                   if (taskTotal > 0) {
                       await clientRef.update({ balance: firebase.firestore.FieldValue.increment(taskTotal) });
                       await db.collection('transactions').add({ serialId: task.serialId, type: 'استرداد 🔵', amount: taskTotal, desc: `استرداد لطلب مرفوض (${task.id.substring(0,6)})`, timestamp: Date.now(), dateString: new Date().toLocaleString('ar-SA') });
                   }
               }
               
               const updatePayload = { status: newStatus };
               if (noteVal !== null && noteVal !== undefined && noteVal.trim() !== '') updatePayload.adminNote = noteVal.trim();

               await reqRef.update(updatePayload);
               setToastMessage('تم تحديث الحالة بنجاح'); setTimeout(()=>setToastMessage(''), 2000);
            } catch(e) { showAlert('حدث خطأ في تحديث الحالة أو الرصيد: ' + e.message); }
        };

        if (newStatus.includes('مرفوض') || newStatus.includes('تم الحل') || newStatus.includes('مكتمل')) {
            showPrompt(`تغيير الحالة إلى "${newStatus}". هل تود إضافة ملاحظة للعميل؟`, (note) => { processChange(note); }, 'text', 'أدخل الملاحظة / سبب الرفض (اختياري)');
        } else { showConfirm(`تغيير حالة الطلب إلى "${newStatus}"؟`, () => processChange('')); }
      };
