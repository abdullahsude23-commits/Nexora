        // معالجة ذكية للرقم المُدخل في خانة تسجيل الدخول ليتطابق مع ما تم حفظه
        let processedLogin = loginInput.replace(/\D/g, '');
        if (processedLogin.startsWith('00')) processedLogin = processedLogin.substring(2);
        else if (processedLogin.startsWith('0')) processedLogin = '963' + processedLogin.substring(1);
        else if (processedLogin.length === 9 && !processedLogin.startsWith('963')) processedLogin = '963' + processedLogin;

        const fakeEmail = `${processedLogin}@nexora.sy`;
        
        try {
           await auth.signInWithEmailAndPassword(fakeEmail, loginPassword);
           const waQuery = await db.collection('clients').where('whatsapp', '==', processedLogin).get();
           if (!waQuery.empty) {
               setUserData(waQuery.docs[0].data());
               changeView('mainHub'); setToastMessage('أهلاً بك مجدداً!');
           } else {
               await auth.signOut();
               showAlert('عذراً! حسابك موجود في خوادم الأمان ولكن تعذر العثور على ملف بياناتك في قاعدة البيانات (Firestore). يرجى مراجعة الإدارة.');
           }
        } catch (error) {
           if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
               try {
                   const waQuery = await db.collection('clients').where('whatsapp', '==', processedLogin).get();
                   let userDoc = null; if (!waQuery.empty) userDoc = waQuery.docs[0].data();
                   if (!userDoc) { showAlert('لم يتم العثور على حساب مرتبط بهذا الرقم.'); setLoading(false); return; }
                   
                   const hashedLoginInput = await hashPassword(loginPassword);
                   if (userDoc.password !== loginPassword && userDoc.password !== hashedLoginInput) { 
                       showAlert('كلمة المرور غير صحيحة!'); setLoading(false); return; 
                   }
                   
                   const userCredential = await auth.createUserWithEmailAndPassword(fakeEmail, loginPassword);
                   await db.collection('clients').doc(userDoc.serialId).update({ uid: userCredential.user.uid, password: firebase.firestore.FieldValue.delete() });
                   
                   const sessionData = { ...userDoc, uid: userCredential.user.uid };
                   delete sessionData.password; setUserData(sessionData); 
                   changeView('mainHub'); setToastMessage('أهلاً بك مجدداً! (تم ترقية أمان حساب تلقائياً)');
               } catch (err) {
                   if (err.code === 'auth/email-already-in-use') showAlert('تعذر الدخول. يرجى طلب "تصفير الأمان" من الإدارة.');
                   else showAlert('حدث خطأ غير متوقع: ' + err.message);
               }
           } else {
               if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') showAlert('كلمة المرور غير صحيحة.');
               else if (error.code === 'auth/too-many-requests') showAlert('تم حظر هذا الحساب مؤقتاً بسبب محاولات دخول فاشلة كثيرة. يرجى المحاولة لاحقاً.');

           }

                           <ul className="text-gray-300 text-xs space-y-1 font-semibold">
                              {bonusTiers.sort((a,b)=>a.threshold-b.threshold).map((tier, i) => (
                                 <li key={i}>• {t('topupGet')} <span className="text-white font-bold">${tier.threshold}</span> {t('getBonus')} <span className="text-green-400 font-bold">${tier.bonus} {t('freeBonus')}</span></li>
                              ))}
                           </ul>
                        </div>

                        <form onSubmit={handleTopUpRequest} className="space-y-4">
                           <div>
                              <label className="text-xs text-gray-400 font-bold mb-3 block">{t('payMethod')}</label>
                              <div className="flex gap-2 mb-4">
                                 <button type="button" onClick={()=>setPaymentMethod('electronic')} className={`flex-1 py-3 rounded-xl border text-sm font-bold transition-all ${paymentMethod === 'electronic' ? 'bg-[#06b6d4]/20 border-[#06b6d4] text-[#06b6d4] shadow-[0_0_15px_rgba(6,182,212,0.2)]' : 'border-white/10 text-gray-400 hover:bg-white/5'}`}>{t('electronicTransfer')}</button>
                                 <button type="button" onClick={()=>setPaymentMethod('cash')} className={`flex-1 py-3 rounded-xl border text-sm font-bold transition-all ${paymentMethod === 'cash' ? 'bg-[#06b6d4]/20 border-[#06b6d4] text-[#06b6d4] shadow-[0_0_15px_rgba(6,182,212,0.2)]' : 'border-white/10 text-gray-400 hover:bg-white/5'}`}>{t('cashPay')}</button>
                              </div>

                              {/* تفاصيل التحويل الإلكتروني */}
                              {paymentMethod === 'electronic' && (
                                 <div className="bg-black/30 border border-white/10 rounded-xl p-4 space-y-3 animate-[fadeIn_0.3s_ease-out] mb-4">
                                     <label className="text-xs text-gray-400 font-bold mb-2 block">{t('selectElectronicMethod')}</label>
                                     <div className="flex gap-2 mb-4">
                                         <button type="button" onClick={()=>setElectronicMethod('usdt')} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all border ${electronicMethod === 'usdt' ? 'bg-purple-500/20 border-purple-500 text-purple-400 shadow-[0_0_15px_rgba(168,85,247,0.2)]' : 'border-white/10 text-gray-400 hover:bg-white/5'}`}>USDT TRC20</button>
                                         <button type="button" onClick={()=>setElectronicMethod('chamcash')} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all border ${electronicMethod === 'chamcash' ? 'bg-blue-500/20 border-blue-500 text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'border-white/10 text-gray-400 hover:bg-white/5'}`}>{t('chamCash')}</button>
                                     </div>
                                     
                                     {electronicMethod === 'usdt' && (
                                         <a href={`https://wa.me/963988893928?text=${encodeURIComponent(`مرحباً منصة NEXORA،\nأريد شحن محفظتي عبر (USDT).\nالرجاء تزويدي برقم حساب التحويل.\n\nالاسم: ${userData ? userData.name : 'عميل'}\nرقم الحساب (ID): ${userData ? userData.serialId : ''}`)}`} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 bg-green-500/10 text-green-400 hover:bg-green-500/20 border border-green-500/30 py-3 rounded-lg font-bold transition-all text-sm shadow-[0_0_10px_rgba(34,197,94,0.1)]">
                                             <WhatsAppIcon className="w-5 h-5"/> {t('reqCryptoBtn')}
                                         </a>
                                     )}
                                     {electronicMethod === 'chamcash' && (
                                         <a href={`https://wa.me/963988893928?text=${encodeURIComponent(`مرحباً منصة NEXORA،\nأريد شحن محفظتي عبر (شام كاش).\nالرجاء تزويدي برقم الحساب.\n\nالاسم: ${userData ? userData.name : 'عميل'}\nرقم الحساب (ID): ${userData ? userData.serialId : ''}`)}`} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 bg-green-500/10 text-green-400 hover:bg-green-500/20 border border-green-500/30 py-3 rounded-lg font-bold transition-all text-sm shadow-[0_0_10px_rgba(34,197,94,0.1)]">
                                             <WhatsAppIcon className="w-5 h-5"/> {t('reqChamCashBtn')}
                                         </a>
                                     )}
                                 </div>
                              )}

                              {/* تفاصيل الدفع النقدي (مركز معتمد) */}
                              {paymentMethod === 'cash' && (
                                 <div className="bg-black/30 border border-white/10 rounded-xl p-4 animate-[fadeIn_0.3s_ease-out] mb-4">
                                    <label className="text-xs text-amber-400 font-bold mb-3 flex items-center gap-2"><MapPinIcon className="w-4 h-4"/> {t('enterCenterName')}</label>
                                    <input required type="text" placeholder={t('centerNamePlaceholder')} className="glass-input w-full rounded-xl py-3 px-4 text-sm font-bold placeholder-gray-500 focus:border-amber-400 focus:shadow-[0_0_15px_rgba(251,191,36,0.3)] transition-all" value={cashCenterName} onChange={e => setCashCenterName(e.target.value)} />
                                 </div>
                              )}
                           </div>
                           <div className="relative">
                              <DollarSignIcon className={`absolute ${lang==='ar'?'right-4':'left-4'} top-4 w-5 h-5 text-gray-500`} />
                              <input required type="number" min="1" step="0.01" placeholder={t('enterAmount')} className={`glass-input w-full rounded-xl py-3 ${lang==='ar'?'pr-12 pl-4':'pl-12 pr-4'} text-lg font-black text-[#06b6d4]`} value={topupAmount} onChange={e => setTopupAmount(e.target.value)} />
                           </div>
                           
                           {topupAmount > 0 && currentBonus > 0 && (
                              <div className="bg-green-500/10 border border-green-500/30 rounded-xl p-3 text-center animate-[fadeIn_0.3s_ease-out]">
                                 <p className="text-green-400 text-sm font-bold">{t('congrats')} <span className="text-white text-lg">${currentBonus}</span> {t('extraFree')}</p>
                                 <p className="text-xs text-gray-400 mt-1">{t('expectedTotal')} <span className="text-white font-bold">${expectedTotal}</span></p>
                              </div>
                           )}

                           {paymentMethod === 'electronic' && (
                              <label className="block w-full border-2 border-dashed border-[#06b6d4]/40 rounded-xl p-4 text-center cursor-pointer hover:bg-[#06b6d4]/10 transition-colors">
                                 <UploadCloudIcon className="w-6 h-6 text-[#06b6d4] mx-auto mb-2" />
                                 <span className="text-xs font-bold text-[#06b6d4]">{receiptFile ? receiptFile.name : t('attachBtn')}</span>
                                 <input type="file" className="hidden" accept="image/*,.pdf" onChange={(e) => handleFileUpload(e, setReceiptFile)} />
                              </label>
                           )}
                           <button type="submit" disabled={loading} className="btn-cyan w-full rounded-xl py-3 text-sm font-bold">{loading ? t('processing') : t('reqTopup')}</button>
                        </form>
                     </div>
                  </div>

                  <div className="glass-card p-6 border-[#06b6d4]/20 flex flex-col max-h-[750px]">
                     <h3 className="text-xl font-bold text-white mb-6 pb-4 border-b border-white/10 flex items-center gap-2"><ActivityIcon className="text-purple-400 w-5 h-5"/> {t('transHistory')}</h3>
                     <div className="flex-1 overflow-y-auto scrollbar-hide space-y-3">
                        {userTransactions.length === 0 ? <p className="text-center text-gray-500 py-10 font-bold border border-dashed border-gray-700 rounded-xl">{t('noTrans')}</p> : userTransactions.map((tr, idx) => (
                           <div key={idx} className="bg-black/30 p-4 rounded-xl border border-white/5 flex justify-between items-center">
                              <div><p className="text-xs text-gray-400 mb-1">{tr.dateString}</p><p className="text-sm font-bold text-white">{tr.desc}</p></div>
                              <div className="text-left">
                                 <p className="text-xs mb-1 font-bold">{tr.type.includes('إيداع') || tr.type.includes('استرداد') ? t('deposit') : t('withdraw')}</p>
                                 <p className={`text-lg font-black ${tr.type.includes('سداد') ? 'text-red-400' : 'text-emerald-400'}`} dir="ltr">{tr.type.includes('سداد') ? '-' : '+'}${parseFloat(tr.amount).toLocaleString('en-US', { maximumFractionDigits: 2 })}</p>
                              </div>
                           </div>
                        ))}
                     </div>
                  </div>
               </div>
            </div>
         );
      };

      const renderMainHub = () => (
        <div className="min-h-screen max-w-6xl mx-auto p-4 md:p-8 pt-12 relative z-10 animate-[fadeIn_0.5s_ease-out] flex flex-col justify-between">
          <div>
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
               <div className="flex items-center gap-4">
                  <img src={LOGO_BASE64} alt="Logo" className="w-14 h-14 object-contain drop-shadow-[0_0_10px_rgba(6,182,212,0.8)]" />
                  <div>
                     {userData ? (
                        <React.Fragment>
                           <h2 className="text-3xl font-black text-white mb-1">{t('welcome')} <span className="text-[#06b6d4]">{userData.name}</span></h2>
                           <div className="flex items-center gap-3 text-gray-400 text-xs font-bold"><ShieldCheckIcon className="w-3 h-3 text-green-400" /> {t('id')} {userData.serialId}</div>
                        </React.Fragment>
                     ) : ( <h2 className="text-3xl font-black text-white">NEXORA <span className="text-[#06b6d4]">PLATFORM</span></h2> )}
                  </div>
               </div>
               
               <div className="flex items-center gap-3 flex-wrap">
                  <div className="glass-card p-1 flex bg-black/50 border-white/10 rounded-full">
                     <button onClick={()=>setLang('ar')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${lang==='ar'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>AR</button>
                     <button onClick={()=>setLang('en')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${lang==='en'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>EN</button>
                     <button onClick={()=>setLang('tr')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${lang==='tr'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>TR</button>
                  </div>
                  <div className="glass-card p-1 flex bg-black/50 border-white/10 rounded-full">
                     <button onClick={()=>setCurrency('USD')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${currency==='USD'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>$</button>
                     <button onClick={()=>setCurrency('SYP')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${currency==='SYP'?'bg-[#06b6d4] text-black':'text-gray-400'}`}>ل.س</button>
                  </div>
                  {userData ? (
                     <React.Fragment>
                        <button onClick={()=>changeView('wallet')} className="glass-card px-4 py-2 flex items-center gap-2 text-emerald-400 font-bold hover:bg-emerald-500/10 transition-colors">
                           <WalletIcon className="w-5 h-5"/>
                           <span dir="ltr">{formatPrice(userData.balance || 0)}</span>
                        </button>
                        <button onClick={()=>setIsCartOpen(true)} className="glass-card px-4 py-2 flex items-center gap-2 text-[#06b6d4] font-bold hover:bg-[#06b6d4]/10 relative"><ShoppingBagIcon className="w-5 h-5"/> {cart.length > 0 && <span className="absolute -top-2 -right-2 bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px]">{cart.length}</span>}</button>
                        <button onClick={logout} className="glass-card px-4 py-2 text-sm font-bold text-red-400 hover:bg-red-500/10">{t('logout')}</button>
                     </React.Fragment>
                  ) : ( <button onClick={() => changeView('login')} className="btn-cyan px-6 py-2 rounded-xl text-sm font-bold shadow-lg flex items-center gap-2"><UserIcon className="w-4 h-4"/> {t('loginPlatform')}</button> )}
               </div>
            </div>

            <div className="text-center mb-16 mt-8">
               <h1 className="text-5xl md:text-7xl font-black tracking-widest mb-4 select-none">
                 <span className="text-white">NEXORA</span> <span className="text-[#06b6d4]">SYRIA</span>
               </h1>
               <p className="text-gray-400 font-bold tracking-wide border-t border-[#06b6d4]/30 pt-4 mx-auto w-fit text-lg">{t('explore')}</p>
            </div>

            {/* قسم العروض الخاطفة (Flash Deals) - Bento Grid 2026 */}
            {flashDeal && flashDeal.active && timeRemaining && (() => {
                const dealService = services.find(s => s.id === flashDeal.serviceId);
                if(!dealService) return null;
                const originalPrice = parseFloat(dealService.price);
                const discountedPrice = originalPrice - (originalPrice * (flashDeal.discount / 100));
                return (
                    <div className="mb-12 relative overflow-hidden glass-card p-1 border-red-500/50 shadow-[0_0_30px_rgba(239,68,68,0.2)] group animate-[fadeIn_0.5s_ease-out]">
                        <div className="absolute inset-0 bg-gradient-to-r from-red-500/10 via-orange-500/10 to-transparent animate-pulse pointer-events-none"></div>
                        <div className="relative z-10 bg-[#050B14]/90 p-6 md:p-8 rounded-[20px] flex flex-col md:flex-row items-center justify-between gap-6 backdrop-blur-md">
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <div className="w-16 h-16 rounded-2xl bg-red-500/20 text-red-400 flex items-center justify-center border border-red-500/40 shrink-0 shadow-[0_0_20px_rgba(239,68,68,0.4)] relative overflow-hidden">
                                    <div className="absolute inset-0 bg-red-500/20 animate-ping rounded-2xl"></div>
                                    <ZapIcon className="w-8 h-8 relative z-10"/>
                                </div>
                                <div>
                                    <h3 className="text-red-400 font-black text-xl mb-1 flex items-center gap-2">عرض خاطف ⚡ خصم {flashDeal.discount}%</h3>
                                    <p className="text-white font-bold text-lg">{dealService[`name_${lang}`] || dealService.name_ar}</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-6 w-full md:w-auto flex-col sm:flex-row">
                                <div className="flex gap-3 text-center" dir="ltr">
                                    <div className="glass-card bg-red-950/40 border-red-500/30 w-14 h-16 flex flex-col items-center justify-center rounded-xl shadow-[0_0_15px_rgba(239,68,68,0.2)]"><span className="text-2xl font-black text-white">{timeRemaining.h.toString().padStart(2, '0')}</span><span className="text-[10px] text-red-300 font-bold mt-1">ساعات</span></div>
                                    <span className="text-2xl font-black text-red-500 mt-2">:</span>
                                    <div className="glass-card bg-red-950/40 border-red-500/30 w-14 h-16 flex flex-col items-center justify-center rounded-xl shadow-[0_0_15px_rgba(239,68,68,0.2)]"><span className="text-2xl font-black text-white">{timeRemaining.m.toString().padStart(2, '0')}</span><span className="text-[10px] text-red-300 font-bold mt-1">دقائق</span></div>
                                    <span className="text-2xl font-black text-red-500 mt-2">:</span>
                                    <div className="glass-card bg-red-950/40 border-red-500/30 w-14 h-16 flex flex-col items-center justify-center rounded-xl shadow-[0_0_15px_rgba(239,68,68,0.2)]"><span className="text-2xl font-black text-red-400 animate-pulse">{timeRemaining.s.toString().padStart(2, '0')}</span><span className="text-[10px] text-red-300 font-bold mt-1">ثواني</span></div>
                                </div>

                                <div className="flex flex-col items-center sm:items-end w-full sm:w-auto mt-4 sm:mt-0">
                                    <div className="flex items-center gap-3 mb-3" dir="ltr">
                                        <span className="text-gray-500 line-through text-sm font-bold">{formatPrice(originalPrice)}</span>
                                        <span className="text-3xl font-black text-emerald-400">{formatPrice(discountedPrice)}</span>
                                    </div>
                                    <button onClick={() => handleRequestService({...dealService, price: discountedPrice, isFlashDeal: true})} className="w-full sm:w-auto bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 text-white shadow-[0_0_20px_rgba(239,68,68,0.5)] px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-transform hover:scale-105 border border-red-400/50">
                                        <ShoppingBagIcon className="w-5 h-5"/> اقتنص العرض الآن
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            })()}

            {/* التحديث الجديد لشريط الإعلانات: حركة بطيئة ومستمرة */}
            {services.length > 0 && (
               <div className="w-full bg-[#06b6d4]/5 border-y border-[#06b6d4]/30 py-4 mb-12 overflow-hidden relative shadow-[0_0_15px_rgba(6,182,212,0.1)] rounded-xl backdrop-blur-md" dir="ltr">
                  <div className="absolute top-0 right-0 h-full w-20 bg-gradient-to-l from-[#050B14] to-transparent z-10 pointer-events-none"></div>
                  <div className="absolute top-0 left-0 h-full w-20 bg-gradient-to-r from-[#050B14] to-transparent z-10 pointer-events-none"></div>
                  <div className="ticker-animate text-sm font-bold">
                      <div className="flex" dir="rtl">
                          {[...services].sort((a,b)=>{ const tA=(a.createdAt && a.createdAt.seconds)||0; const tB=(b.createdAt && b.createdAt.seconds)||0; return tB-tA; }).slice(0, 10).map((s, i) => (
                              <span key={i} className="text-emerald-400 mx-8 flex items-center gap-2 whitespace-nowrap">
                                  <ActivityIcon className="w-5 h-5 text-[#06b6d4]" />
                                  أحدث إضافاتنا: <span className="text-white text-base mx-1">{s[`name_${lang}`] || s.name_ar}</span> بسعر <span dir="ltr" className="text-yellow-400">${s.price}</span>
                              </span>
                          ))}
                      </div>
                      <div className="flex" dir="rtl">
                          {[...services].sort((a,b)=>{ const tA=(a.createdAt && a.createdAt.seconds)||0; const tB=(b.createdAt && b.createdAt.seconds)||0; return tB-tA; }).slice(0, 10).map((s, i) => (
                              <span key={i + 'clone'} className="text-emerald-400 mx-8 flex items-center gap-2 whitespace-nowrap">
                                  <ActivityIcon className="w-5 h-5 text-[#06b6d4]" />
                                  أحدث إضافاتنا: <span className="text-white text-base mx-1">{s[`name_${lang}`] || s.name_ar}</span> بسعر <span dir="ltr" className="text-yellow-400">${s.price}</span>
                              </span>
                          ))}
                      </div>
                  </div>
               </div>
            )}

            <div id="services-section" className="mb-12">
               <h3 className={`text-2xl font-black text-white mb-6 border-${lang==='ar'?'r':'l'}-4 border-[#06b6d4] p${lang==='ar'?'r':'l'}-4`}>{t('servicesCats')}</h3>
               <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-16">
                  {defaultCategories.map((cat, idx) => {
                     const colorClass = getColorClasses(cat.color);
                     const catName = cat[`name_${lang}`] || cat.name_ar || cat.name;
                     return (
                       <div key={cat.id} onClick={() => changeView('mainHub', cat)} className="glass-card p-6 cursor-pointer group flex flex-col items-center text-center justify-center min-h-[160px]">
                         <div className={`w-14 h-14 rounded-xl flex items-center justify-center mb-4 transition-transform group-hover:scale-110 border ${colorClass.split(' ')[1]} ${colorClass.split(' ')[2]}`}>
                           {getIconComponent(cat.icon, `w-7 h-7 ${colorClass.split(' ')[0]}`)}
                         </div>
                         <h3 className="font-bold text-sm text-gray-200 group-hover:text-white transition-colors">{catName}</h3>
                       </div>
                     )
                  })}
               </div>
            </div>

            {/* --- قسم شبكة التقييمات والآراء (Testimonials Bento) 2026 --- */}
            {publicTestimonials.length > 0 && (
                <div className="mb-16 animate-[fadeIn_0.8s_ease-out]">
                    <h3 className={`text-2xl font-black text-white mb-8 border-${lang==='ar'?'r':'l'}-4 border-yellow-500 p${lang==='ar'?'r':'l'}-4 flex items-center gap-3`}>
                        <StarIcon className="w-7 h-7 text-yellow-500"/> آراء عملاء NEXORA
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {publicTestimonials.map(t => (
                            <div key={t.id} className="glass-card p-6 border-yellow-500/20 hover:border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.05)] hover:shadow-[0_0_25px_rgba(234,179,8,0.2)] transition-all duration-300 group relative overflow-hidden flex flex-col">
                                 <div className="absolute -top-12 -right-12 w-28 h-28 bg-yellow-500/10 rounded-full blur-2xl group-hover:bg-yellow-500/20 transition-all pointer-events-none"></div>
                                 <div className="flex gap-1 mb-4">
                                    {[...Array(5)].map((_,i)=><StarIcon key={i} className="w-4 h-4 text-yellow-500"/>)}
                                 </div>
                                 <p className="text-gray-200 font-bold text-sm leading-relaxed mb-6 flex-1">"{t.content}"</p>
                                 <div className="flex items-center gap-4 border-t border-white/5 pt-4 mt-auto">
                                    <div className="w-10 h-10 shrink-0 rounded-full bg-gradient-to-br from-yellow-500 to-orange-500 flex items-center justify-center font-black text-black text-lg">{t.clientName.charAt(0)}</div>
                                    <div>
                                        <p className="text-white font-bold text-sm">{t.clientName}</p>
                                        <p className="text-xs text-yellow-500/80 font-mono mt-0.5">{t.dateString}</p>
                                    </div>
                                 </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {userData && (
               <div className="border-t border-white/10 pt-12 mb-12 animate-[fadeIn_0.8s_ease-out]">
                  
                  {/* --- إضافة تقييم جديد للعميل --- */}
                  {!hasSubmittedReview && (
                      <div className="glass-card p-6 md:p-8 border-yellow-500/30 mb-12 shadow-[0_0_30px_rgba(234,179,8,0.1)] relative overflow-hidden group">
                          <div className="absolute top-0 right-0 w-full h-full bg-gradient-to-l from-yellow-500/5 to-transparent pointer-events-none"></div>
                          <h4 className="text-xl font-black text-yellow-500 mb-2 flex items-center gap-2"><MessageSquareIcon className="w-6 h-6"/> شاركنا رأيك بخدماتنا</h4>
                          <p className="text-sm text-gray-300 mb-6 font-bold">رأيك يهمنا ويساعدنا على تقديم الأفضل. قيّم تجربتك بـ 5 نجوم واكتب رسالة قصيرة!</p>

               <a href="https://www.facebook.com/share/18NVL9PX3Q/" target="_blank" rel="noopener noreferrer" className="p-3 rounded-full bg-white/5 hover:bg-blue-500/20 text-gray-400 hover:text-blue-400 transition-all shadow-[0_0_0_rgba(59,130,246,0)] hover:shadow-[0_0_15px_rgba(59,130,246,0.4)] border border-white/10 hover:border-blue-500/30">
                  <FacebookIcon className="w-5 h-5"/>

      const renderCategoryView = () => {

         const sortedServices = [...catServices].sort((a, b) => {

             const nameB = (b[`name_${lang}`] || b.name_ar || b.name || '').toLowerCase();
             return nameA.localeCompare(nameB, lang === 'ar' ? 'ar' : 'en');

         // 2. الفلترة بناءً على شريط البحث

             const desc = (srv[`desc_${lang}`] || srv.desc_ar || srv.desc || '').toLowerCase();
             return name.includes(term) || desc.includes(term);

         const colorClass = getColorClasses(activeCategory.color);

      const renderCartModal = () => {
         const rawTotal = cart.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0);

         const finalTotal = discountInfo.active ? rawTotal - (rawTotal * (percentVal / 100)) : rawTotal;

         const isBalanceSufficient = userBalance >= finalTotal;

         return (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-[fadeIn_0.2s_ease-out]">

                                 <button onClick={() => setCart(cart.filter((_, i) => i !== idx))} className="text-red-400 p-2 hover:bg-red-500/20 rounded-lg"><Trash2Icon className="w-4 h-4"/></button>
                              </div>
                              );
                        })}
                     </div>

                     {cart.length > 0 && (
                        <div className="glass-card p-5 bg-black/30 border-white/5 mb-6">
                           <div className="flex justify-between items-center mb-2">
                              <span className="text-gray-400 font-bold text-sm">{t('balance')}</span>
                              <span className={`text-lg font-black ${isBalanceSufficient ? 'text-emerald-400' : 'text-red-400'}`} dir="ltr">{formatPrice(userBalance)}</span>
                           </div>
                           {!isBalanceSufficient && (
                              <div className="mt-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold text-center">
                                 {t('insufficient')}
                                 <button onClick={() => { setIsCartOpen(false); changeView('wallet'); }} className="block mt-2 mx-auto underline">{t('goToTopup')}</button>

                  </div>

                  {cart.length > 0 && (
                     <div className="p-6 border-t border-white/10 shrink-0 bg-black/40 rounded-b-2xl">
                        <div className="flex justify-between items-center mb-4"><span className="text-gray-400 font-bold text-sm">{t('totalRequired')}</span><span className="text-2xl font-black text-[#06b6d4]" dir="ltr">{formatPrice(finalTotal)}</span></div>
                        <button onClick={handleCheckoutFromWallet} disabled={loading || !isBalanceSufficient} className={`w-full rounded-xl py-4 text-sm font-bold flex justify-center items-center gap-2 transition-all ${isBalanceSufficient ? 'btn-cyan' : 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700'}`}>
                           {loading ? t('processing') : <React.Fragment><WalletIcon className="w-5 h-5"/> {t('payFromWallet')}</React.Fragment>}
                        </button>
                     </div>
                  )}
               </div>
            </div>
         );
      };

      const renderAdminDashboard = () => {
        const totalRevenue = adminTasks.filter(t => (t.status || '').includes('مكتمل') && !(t.type || '').includes('شحن')).reduce((sum, t) => sum + parseFloat(t.total || 0), 0);
        const pendingCount = adminTasks.filter(t => (t.status || '').includes('قيد المراجعة') || (t.status || '').includes('بانتظار التسعير')).length;
        const totalTrust = adminClients.reduce((sum, client) => sum + (parseFloat(client.balance) || 0), 0);
        
        const totalBonusesGiven = adminTasks.filter(t => (t.status || '').includes('مكتمل') && (t.type || '').includes('شحن')).reduce((sum, t) => sum + (parseFloat(t.bonusAmount) || 0), 0);

        const filteredOrders = adminTasks.filter(task => {
            const s = task.status || 'قيد المراجعة ⏳';
            if (adminOrderFilter === 'all') return true;
            if (adminOrderFilter === 'pending') return s.includes('مراجعة') || s.includes('بانتظار التسعير');
            if (adminOrderFilter === 'progress') return s.includes('تنفيذ') || s.includes('بانتظار موافقة العميل');
            if (adminOrderFilter === 'completed') return s.includes('مكتمل') || s.includes('تم الحل');
            if (adminOrderFilter === 'rejected') return s.includes('مرفوض');
            return true;
        });
        const paginatedOrders = filteredOrders.slice((adminOrdersPage - 1) * itemsPerPage, adminOrdersPage * itemsPerPage);
        const totalOrderPages = Math.ceil(filteredOrders.length / itemsPerPage);

        const paginatedClients = adminClients.slice((adminClientsPage - 1) * itemsPerPage, adminClientsPage * itemsPerPage);
        const totalClientPages = Math.ceil(adminClients.length / itemsPerPage);

        return (

            <div className="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                <div className="glass-card p-8 border-t-4 border-t-red-500 shadow-[0_0_30px_rgba(239,68,68,0.1)]">
                    <h3 className="text-2xl font-black mb-2 text-white flex items-center gap-3"><ZapIcon className="text-red-500 w-8 h-8"/> إدارة العروض الخاطفة (Flash Deals) ⚡</h3>
                    <p className="text-sm text-gray-400 mb-8 font-bold">حدد خدمة لتشغيل خصم ضخم عليها لفترة زمنية مؤقتة. سيظهر العرض مع عداد تنازلي في الصفحة الرئيسية لجميع الزوار لزيادة المبيعات (نظام FOMO).</p>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 bg-black/30 p-6 rounded-xl border border-white/5">
                        <div className="flex-1">
                            <label className="text-xs text-gray-400 font-bold mb-2 block">اختر الخدمة المستهدفة</label>
                            <select className="glass-input w-full rounded-xl py-3 px-4 text-sm font-bold outline-none cursor-pointer" value={adminFlashDealInput.serviceId} onChange={e=>setAdminFlashDealInput({...adminFlashDealInput, serviceId: e.target.value})}>
                                <option value="" className="bg-gray-900 text-gray-400">-- اختر خدمة --</option>
                                {services.map(s => <option key={s.id} value={s.id} className="bg-gray-900 text-white">{s.name_ar}</option>)}
                            </select>
                        </div>
                        <div className="flex-1">
                            <label className="text-xs text-orange-400 font-bold mb-2 block">نسبة الخصم (%)</label>
                            <input type="number" min="1" max="99" className="glass-input w-full rounded-xl py-3 px-4 text-sm font-black text-orange-400 focus:border-orange-500 focus:shadow-[0_0_15px_rgba(249,115,22,0.3)]" placeholder="مثال: 50" value={adminFlashDealInput.discount} onChange={e=>setAdminFlashDealInput({...adminFlashDealInput, discount: e.target.value})} />
                        </div>
                        <div className="flex-1">
                            <label className="text-xs text-red-400 font-bold mb-2 block">مدة العرض (بالساعات)</label>
                            <input type="number" min="1" className="glass-input w-full rounded-xl py-3 px-4 text-sm font-black text-red-400 focus:border-red-500 focus:shadow-[0_0_15px_rgba(239,68,68,0.3)]" placeholder="مثال: 24" value={adminFlashDealInput.hours} onChange={e=>setAdminFlashDealInput({...adminFlashDealInput, hours: e.target.value})} />
                        </div>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-4">
                        <button onClick={handleStartFlashDeal} disabled={loading || (flashDeal && flashDeal.active)} className={`flex-1 py-4 rounded-xl font-black text-lg transition-all flex justify-center items-center gap-2 ${flashDeal && flashDeal.active ? 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700' : 'bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 text-white shadow-[0_0_20px_rgba(239,68,68,0.4)] hover:scale-[1.02]'}`}>
                            <ZapIcon className="w-6 h-6"/> إطلاق العرض الآن
                        </button>
                        {flashDeal && flashDeal.active && (
                            <button onClick={handleStopFlashDeal} disabled={loading} className="px-8 bg-red-500/20 text-red-400 hover:bg-red-500/30 border border-red-500/50 py-4 rounded-xl font-bold transition-colors shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                                إيقاف العرض ⏸️
                            </button>
                        )}
                    </div>
                </div>

                {flashDeal && flashDeal.active && (
                   <div className="glass-card p-6 border-l-4 border-l-orange-500 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-orange-500/5 shadow-[0_0_20px_rgba(249,115,22,0.1)]">
                      <div>
                          <h4 className="text-orange-400 font-bold mb-2 flex items-center gap-2"><TimerIcon className="w-5 h-5 animate-spin-slow"/> عرض نشط حالياً! (خصم {flashDeal.discount}%)</h4>
                          <p className="text-lg text-white font-black">{(services.find(s => s.id === flashDeal.serviceId) || {}).name_ar}</p>
                      </div>
                      <div className="text-right sm:text-left bg-black/40 p-3 rounded-lg border border-white/5" dir="ltr">
                          <p className="text-xs text-gray-400 mb-1 font-bold text-right sm:text-left">:ينتهي في</p>
                          <p className="text-lg font-black text-red-400">{new Date(flashDeal.endTime).toLocaleString('ar-SA')}</p>
                      </div>
                   </div>
                )}
            </div>
          )}

          {/* --- قسم الإدارة الجديد: التقييمات والآراء 🌟 --- */}
          {adminViewSection === 'testimonials' && (
              <div className="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                  <div className="glass-card p-8 border-t-4 border-t-yellow-500 shadow-[0_0_30px_rgba(234,179,8,0.05)]">
                      <h3 className="text-2xl font-black mb-2 text-white flex items-center gap-3"><StarIcon className="text-yellow-500 w-8 h-8"/> إدارة آراء العملاء</h3>
                      <p className="text-sm text-gray-400 mb-8 font-bold">هنا يمكنك مراجعة آراء العملاء. التقييمات "المعتمدة" فقط هي التي ستظهر في الصفحة الرئيسية لزيادة الموثوقية (Social Proof).</p>
                      
                      <div className="grid grid-cols-1 gap-4">
                          {adminTestimonials.length === 0 ? <p className="text-center text-gray-500 font-bold py-10 glass-card border-dashed">لا توجد تقييمات مسجلة حتى الآن.</p> : adminTestimonials.map(t => (
                              <div key={t.id} className="glass-card p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-white/5 hover:border-yellow-500/30 transition-all">
                                  <div className="flex-1 w-full">
                                      <div className="flex items-center gap-2 mb-2">
                                          <span className="text-xs text-gray-400 font-bold">{t.dateString}</span>
                                          <span className={`text-xs px-3 py-1 rounded-full font-bold ${t.status === 'pending' ? 'bg-amber-500/20 text-amber-400' : t.status === 'approved' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                                              {t.status === 'pending' ? 'بانتظار المراجعة ⏳' : t.status === 'approved' ? 'معتمد ويظهر للجميع ✅' : 'مرفوض ❌'}
                                          </span>
                                      </div>
                                      <h4 className="text-lg font-black text-white flex items-center gap-2 mb-2">
                                          <UserIcon className="w-5 h-5 text-gray-400"/> {t.clientName}
                                          <span className="text-yellow-500 flex gap-0.5 ml-2">
                                              {[...Array(5)].map((_,i)=><StarIcon key={i} className="w-4 h-4"/>)}
                                          </span>
                                      </h4>
                                      <p className="text-gray-300 font-semibold bg-black/30 p-4 rounded-xl border border-white/5">"{t.content}"</p>
                                  </div>
                                  <div className="flex md:flex-col gap-2 w-full md:w-48 shrink-0">
                                      {t.status !== 'approved' && (
                                          <button onClick={() => handleTestimonialStatus(t.id, 'approved')} className="flex-1 w-full bg-green-500/10 hover:bg-green-500/20 text-green-400 border border-green-500/30 py-2 rounded-lg font-bold text-sm transition-colors">قبول وعرض ✅</button>
                                      )}
                                      {t.status !== 'rejected' && (
                                          <button onClick={() => handleTestimonialStatus(t.id, 'rejected')} className="flex-1 w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 py-2 rounded-lg font-bold text-sm transition-colors">إخفاء / رفض ❌</button>
                                      )}
                                      <button onClick={() => {
                                          showConfirm('تأكيد حذف التقييم نهائياً؟', async () => {
                                              await db.collection('testimonials').doc(t.id).delete();
                                              setToastMessage('تم الحذف.');
                                          });
                                      }} className="flex-1 w-full bg-gray-800 hover:bg-gray-700 text-gray-400 py-2 rounded-lg font-bold text-sm transition-colors"><Trash2Icon className="w-4 h-4 inline"/></button>
                                  </div>
                              </div>
                          ))}
                      </div>
                  </div>
              </div>
          )}

          {adminViewSection === 'gifts' && (
            <div className="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                <div className="glass-card p-8 border-t-4 border-t-fuchsia-500 shadow-[0_0_30px_rgba(217,70,239,0.05)]">
                    <h3 className="text-2xl font-black mb-2 text-white flex items-center gap-3"><GiftIcon className="text-fuchsia-400 w-8 h-8"/> {t('newClientsGifts')}</h3>
                    <p className="text-sm text-gray-400 mb-8 font-bold">{t('welcomeGiftDesc')}</p>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {adminClients.filter(c => !c.welcomeGiftSent).length === 0 ? (
                            <p className="text-center text-gray-500 font-bold py-10 glass-card border-dashed col-span-full">{t('noNewClients')}</p>
                        ) : adminClients.filter(c => !c.welcomeGiftSent).map(client => (
                            <div key={client.id} className="glass-card p-6 border-fuchsia-500/20 hover:border-fuchsia-500/50 hover:shadow-[0_0_20px_rgba(217,70,239,0.15)] transition-all flex flex-col group">
                                <div className="flex justify-between items-start mb-4 border-b border-white/5 pb-4">
                                    <div>
                                        <p className="font-black text-white text-lg flex items-center gap-2"><UserIcon className="w-4 h-4 text-gray-400"/> {client.name}</p>
                                        <p className="text-xs text-fuchsia-400 font-mono font-bold mt-1 tracking-wider">{client.serialId}</p>
                                    </div>
                                    <span className="text-[10px] bg-white/10 px-2 py-1 rounded text-gray-300 font-bold">{client.dateString}</span>
                                </div>
                                <div className="mt-auto space-y-4">
                                    <div>
                                        <label className="text-xs text-gray-400 font-bold mb-2 block">{t('giftAmountLbl')}</label>
                                        <div className="relative">
                                            <DollarSignIcon className={`absolute ${lang==='ar'?'right-3':'left-3'} top-2.5 w-4 h-4 text-fuchsia-500`} />
                                            <input type="number" min="0.01" step="0.01" className={`glass-input w-full rounded-lg py-2 ${lang==='ar'?'pr-9 pl-3':'pl-9 pr-3'} text-sm font-black text-fuchsia-400 focus:border-fuchsia-500 focus:shadow-[0_0_10px_rgba(217,70,239,0.2)]`} placeholder="مثال: 5" value={giftAmounts[client.serialId] || ''} onChange={e => setGiftAmounts({...giftAmounts, [client.serialId]: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={() => handleSendWelcomeGift(client)} disabled={loading} className="w-full bg-fuchsia-500/20 text-fuchsia-400 hover:bg-fuchsia-500/40 border border-fuchsia-500/30 py-3 rounded-lg font-bold text-sm transition-colors flex justify-center items-center gap-2 shadow-[0_0_10px_rgba(217,70,239,0.1)]">
                                            <GiftIcon className="w-5 h-5"/> إهداء الرصيد وإرسال رسالة واتساب
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
          )}

          {adminViewSection === 'settings' && (
            <div className="space-y-8">
               
               <div className="glass-card p-8 border-t-4 border-t-purple-500">
                  <h3 className="text-2xl font-black mb-4 text-white flex items-center gap-2"><GiftIcon className="text-purple-400 w-8 h-8"/> {t('manageBonuses')}</h3>
                  <p className="text-sm text-gray-400 mb-6">{t('manageBonusesDesc')}</p>
                  
                  <div className="flex flex-wrap gap-4 items-end mb-6 bg-black/30 p-4 rounded-xl border border-white/5">
                     <div className="flex-1 min-w-[150px]">
                        <label className="text-xs text-gray-400 font-bold mb-1 block">{t('whenTopup')}</label>
                        <input type="number" className="glass-input w-full rounded-xl py-3 px-4 font-bold" placeholder="مثال: 50" value={newTier.threshold} onChange={e=>setNewTier({...newTier, threshold: e.target.value})} />
                     </div>
                     <div className="flex-1 min-w-[150px]">
                        <label className="text-xs text-green-400 font-bold mb-1 block">{t('bonusValue')}</label>
                        <input type="number" className="glass-input w-full rounded-xl py-3 px-4 font-bold text-green-400" placeholder="مثال: 10" value={newTier.bonus} onChange={e=>setNewTier({...newTier, bonus: e.target.value})} />
                     </div>
                     <button onClick={() => {
                         if(newTier.threshold && newTier.bonus) {
                            setBonusTiers(prev => [...prev, {threshold: parseFloat(newTier.threshold), bonus: parseFloat(newTier.bonus)}].sort((a,b)=>b.threshold-a.threshold));
                            setNewTier({threshold:'', bonus:''});
                         }
                     }} className="bg-purple-500/20 text-purple-400 hover:bg-purple-500/30 px-6 py-3 rounded-xl font-bold border border-purple-500/30 transition-colors">{t('addOfferBtn')}</button>
                  </div>

                  <div className="space-y-3 mb-6">
                     {bonusTiers.sort((a,b)=>b.threshold-a.threshold).map((tier, idx) => (
                        <div key={idx} className="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/10">
                           <div className="font-bold text-sm">
                              {t('topupGet')} <span className="text-[#06b6d4]">${tier.threshold}</span> <ArrowRightIcon className={`inline w-4 h-4 mx-2 ${lang==='ar'?'rotate-180':''}`} /> {t('getBonus')} <span className="text-green-400">${tier.bonus}</span>
                           </div>
                           <button onClick={()=>setBonusTiers(bonusTiers.filter((_, i) => i !== idx))} className="text-red-400 p-2 hover:bg-red-500/20 rounded-lg"><Trash2Icon className="w-4 h-4"/></button>
                        </div>
                     ))}
                  </div>

                  <button onClick={handleSaveBonusTiers} disabled={loading} className="w-full bg-purple-600/80 hover:bg-purple-600 text-white py-3 rounded-xl font-bold transition-colors">{t('saveOffersBtn')}</button>
               </div>

               <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="glass-card p-8 border-t-4 border-t-[#06b6d4]">
                     <h3 className="text-2xl font-black mb-4 text-white flex items-center gap-2"><DollarSignIcon className="text-[#06b6d4] w-8 h-8"/> Rate (USD/SYP)</h3>
                     <div className="flex flex-col sm:flex-row gap-4 items-center">
                        <input type="number" className="glass-input w-full rounded-xl py-4 px-4 text-xl font-black text-white" value={newExchangeRateInput} onChange={e => setNewExchangeRateInput(e.target.value)} />
                        <button onClick={handleUpdateExchangeRate} disabled={loading} className="btn-cyan px-10 py-4 rounded-xl font-bold flex justify-center items-center gap-2">حفظ</button>
                     </div>
                  </div>
               </div>

               <div className="glass-card p-8 border-t-4 border-t-red-500">
                  <h3 className="text-2xl font-black mb-6 text-white flex items-center gap-2"><SettingsIcon className="text-red-400 w-8 h-8"/> إدارة النظام والبيانات المتقدمة</h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                     <div className="bg-black/30 p-6 rounded-xl border border-white/5">
                        <h4 className="font-bold text-emerald-400 mb-2">تصدير البيانات (النسخ الاحتياطي)</h4>
                        <p className="text-xs text-gray-400 mb-4">تحميل كافة بيانات العملاء والطلبات كملف CSV قابل للفتح في برنامج Excel.</p>
                        <button onClick={handleExportData} disabled={loading} className="w-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30 py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                           <DownloadIcon className="w-5 h-5"/> تصدير قاعدة البيانات (Excel)
                        </button>
                     </div>

                     <div className="bg-black/30 p-6 rounded-xl border border-red-500/10">
                        <h4 className="font-bold text-red-500 mb-2">استعادة ضبط المصنع</h4>
                        <p className="text-xs text-gray-400 mb-4">هذا الإجراء سيقوم بحذف <span className="text-red-400 font-bold">جميع</span> العملاء، الطلبات، والخدمات نهائياً من قاعدة بيانات Firebase.</p>
                        <button onClick={handleFactoryReset} disabled={loading} className="w-full bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600/40 py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                           <Trash2Icon className="w-5 h-5"/> مسح كافة بيانات النظام
                        </button>
                     </div>
                  </div>
               </div>
            </div>
          )}
        </div>
      );
      };

      return (
        <div className="relative min-h-screen selection:bg-[#06b6d4]/30 flex flex-col">
          <style>{customStyles}</style>
          
          <div className="tech-animated-bg"></div>
          <div className="glowing-orb"></div>
          <div className="glowing-orb-2"></div>
          
          {renderWelcomePromo()}
          {renderDialog()}
          {toastMessage && <div className="fixed top-6 right-1/2 translate-x-1/2 z-[9999] glass-card bg-green-900/40 border-green-500/50 px-6 py-4 flex items-center gap-3 shadow-[0_0_20px_rgba(16,185,129,0.3)]"><CheckCircleIcon className="text-green-400 w-6 h-6" /><span className="font-bold text-sm text-white">{toastMessage}</span></div>}
          
          {/* واجهة الإشعار الحي (Social Proof) - Bento Grid / Neon Purple */}
          {liveNotification && !showAdminLogin && currentView === 'mainHub' && (
              <div className={`fixed bottom-6 ${lang === 'ar' ? 'left-6' : 'right-6'} z-[9998] live-notification-card rounded-2xl p-4 w-[320px] flex items-center gap-4 cursor-default transition-transform duration-300 hover:scale-105`}>
                  <div className="shrink-0 w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/30 flex items-center justify-center relative overflow-hidden shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                      <div className="absolute inset-0 bg-purple-500/20 animate-ping rounded-2xl"></div>
                      <ActivityIcon className="w-6 h-6 text-purple-400 relative z-10" />
                  </div>
                  <div className="flex-1 overflow-hidden">
                      <p className="text-gray-300 text-xs font-bold mb-1 flex justify-between items-center gap-2">
                          <span className="truncate">{liveNotification.message}</span>
                          <span className="text-purple-400 text-[10px] shrink-0 whitespace-nowrap">{liveNotification.time}</span>
                      </p>
                      <p className="text-white text-sm font-black truncate" dir="auto">{liveNotification.service}</p>
                  </div>
              </div>
          )}
          
          {isCartOpen && renderCartModal()}
          
          <div className="flex-grow">
            {currentView === 'login' && !showAdminLogin && renderLogin()}
            {currentView === 'register' && !showAdminLogin && renderRegister()}
            {currentView === 'about' && !showAdminLogin && renderAbout()}
            {currentView === 'terms' && !showAdminLogin && renderTerms()}
            {currentView === 'wallet' && !showAdminLogin && renderWallet()}
            {currentView === 'mainHub' && !activeCategory && !showAdminLogin && renderMainHub()}
            {currentView === 'mainHub' && activeCategory && !showAdminLogin && renderCategoryView()}
            {currentView === 'adminDashboard' && renderAdminDashboard()}
          </div>

          {showAdminLogin && currentView !== 'adminDashboard' && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-[fadeIn_0.3s_ease-out]">
               <div className="glass-card w-full max-w-sm p-8 text-center border-red-500/50 shadow-[0_0_40px_rgba(239,68,68,0.2)]">
                  <LockIcon className="w-10 h-10 text-red-500 mx-auto mb-4" />
                  <h3 className="text-xl font-bold mb-2">{t('adminGateway')}</h3>
                  <p className="text-sm text-gray-400 mb-6">{t('adminMsg')}</p>
                  <form onSubmit={handleAdminLogin}>
                    <input type="password" placeholder="PIN" className="glass-input w-full rounded-xl py-3 text-center tracking-widest font-bold mb-4" value={adminPin} onChange={e=>setAdminPin(e.target.value)} />
                    <div className="flex gap-2">
                       <button type="button" onClick={() => setShowAdminLogin(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-400">{t('cancel')}</button>
                       <button type="submit" disabled={loading} className="flex-1 bg-red-500/20 text-red-400 font-bold py-3 rounded-xl border border-red-500/30">{t('safeLogin')}</button>
                    </div>
                  </form>
               </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
